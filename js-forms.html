<script>
  // ==========================================
  // js-forms.html — 申請表單提交與圖片上傳
  // 職責：三大表單提交、圖片拖放、表單重置
  // 包含優化C：initImageDropZone 共用拖放初始化函數
  // 載入順序：依賴 js-core.html、js-auth.html
  // ==========================================

  // ==========================================
  // 共用表單輔助函數 (Shared Utilities)
  // ==========================================

  function validateUserDomain(emailVal, actionName = '送出申請') {
    const email = (emailVal || AppState.currentUserEmail || '').toLowerCase();
    if (!email.endsWith('@' + allowedDomain)) {
      alert('請先登入 @' + allowedDomain + ' 帳號後再' + actionName + '。');
      return false;
    }
    return email;
  }

  function setSubmitButtonLoading(btn, isLoading, originalText = '送出申請') {
    if (!btn) return;
    btn.disabled = isLoading;
    btn.innerHTML = isLoading ? '<span>處理中...請稍候</span>' : `<span>${originalText}</span>`;
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) {
        resolve(null);
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => resolve({ base64: e.target.result, name: file.name });
      reader.onerror = (e) => reject(e);
      reader.readAsDataURL(file);
    });
  }

  // 動態切換液態藥品濃度輸入格及自定義分類輸入格
  function toggleCategoryFields() {
    const cat = DOM.category.value;
    const blockConc = DOM.concentrationBlock;
    const inputConc = DOM.concentration;
    const volumeInput = DOM.volume;

    if (cat === '液態藥品') {
      blockConc.classList.remove('hidden');
      inputConc.required = true;
      volumeInput.required = true;
    } else {
      blockConc.classList.add('hidden');
      inputConc.required = false;
      volumeInput.required = false;
      inputConc.value = '';
      volumeInput.value = '';
    }

    const blockOther = DOM.otherCategoryBlock;
    const inputOther = DOM.otherCategory;
    if (cat === '其他') {
      blockOther.classList.remove('hidden');
      inputOther.required = true;
    } else {
      blockOther.classList.add('hidden');
      inputOther.required = false;
      inputOther.value = '';
    }
  }

  // 整合後的表單清除重填通用邏輯
  function resetForm(type) {
    const configs = {
      chem: { formId: 'appForm', prefix: '', hasImg: true, imgPrefix: '', callback: () => { if (typeof toggleCategoryFields === 'function') toggleCategoryFields(); } },
      equip: { formId: 'equipForm', prefix: 'equip_', hasImg: true, imgPrefix: 'equip' },
      equipBorrow: { formId: 'equipBorrowForm', prefix: 'equipBorrow_', hasImg: true, imgPrefix: 'equipBorrow' }
    };

    const config = configs[type];
    if (!config) return;

    const form = document.getElementById(config.formId);
    if (form) form.reset();

    const applicantVal = AppState.currentUserDisplayName || (AppState.currentUserEmail ? AppState.currentUserEmail.split('@')[0] : '尚未登入');
    const emailVal = AppState.currentUserEmail || '尚未登入';

    const applicantInput = document.getElementById(config.prefix + 'applicant');
    const emailInput = document.getElementById(config.prefix + 'email');
    if (applicantInput) applicantInput.value = applicantVal;
    if (emailInput) emailInput.value = emailVal;

    if (config.hasImg && typeof removeImage === 'function') {
      removeImage(null, config.imgPrefix || '');
    }

    if (config.callback) config.callback();
  }

  function resetChemForm() { resetForm('chem'); }
  function resetEquipForm() { resetForm('equip'); }
  function resetEquipBorrowForm() { resetForm('equipBorrow'); }

  // 圖片預覽顯示
  function showPreview(file, prefix) {
    const idPrefix = prefix ? (prefix + '_') : '';
    const previewContainer = document.getElementById(idPrefix + 'preview-container');
    const uploadPrompt = document.getElementById(idPrefix + 'upload-prompt');
    const imagePreview = document.getElementById(idPrefix + 'image-preview');
    const imageFilename = document.getElementById(idPrefix + 'image-filename');

    const reader = new FileReader();
    reader.onload = async (e) => {
      imagePreview.src = e.target.result;
      imageFilename.textContent = file.name || '貼上的圖片.png';
      uploadPrompt.classList.add('hidden');
      previewContainer.classList.remove('hidden');
      previewContainer.classList.add('inline-block');
    };
    reader.readAsDataURL(file);
  }

  function removeImage(e, prefix) {
    if (e) e.stopPropagation();
    const idPrefix = prefix ? (prefix + '_') : '';
    const fileInput = document.getElementById(idPrefix + 'photoFile');
    const previewContainer = document.getElementById(idPrefix + 'preview-container');
    const uploadPrompt = document.getElementById(idPrefix + 'upload-prompt');
    const imagePreview = document.getElementById(idPrefix + 'image-preview');

    if (fileInput) fileInput.value = '';
    if (imagePreview) imagePreview.src = '';
    if (previewContainer) {
      previewContainer.classList.add('hidden');
      previewContainer.classList.remove('inline-block');
    }
    if (uploadPrompt) uploadPrompt.classList.remove('hidden');
  }

  // 優化C：通用圖片拖放初始化（消除 chem / equipBorrow 的重複拖放邏輯）
  function initImageDropZone(zoneId, fileInputId, prefix) {
    const zone = document.getElementById(zoneId);
    const input = document.getElementById(fileInputId);
    if (!zone || !input) return;

    input.addEventListener('change', function (e) {
      if (e.target.files && e.target.files.length > 0) {
        showPreview(e.target.files[0], prefix);
      }
    });

    zone.addEventListener('dragover', function (e) {
      e.preventDefault();
      zone.classList.add('bg-blue-50', 'border-blue-400');
    });

    zone.addEventListener('dragleave', function (e) {
      e.preventDefault();
      zone.classList.remove('bg-blue-50', 'border-blue-400');
    });

    zone.addEventListener('drop', function (e) {
      e.preventDefault();
      zone.classList.remove('bg-blue-50', 'border-blue-400');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file.type.startsWith('image/')) {
          input.files = e.dataTransfer.files;
          showPreview(file, prefix);
        } else {
          alert('請上傳圖片格式的檔案！');
        }
      }
    });
  }

  const FORM_CONFIG = {
    chem: {
      submitBtnId: 'submitBtn',
      fileInputId: 'photoFile',
      backendFn: 'submitChem',
      cacheKeys: ['user_chem', 'admin_chem'],
      resetFn: resetChemForm,
      btnLoadingText: '送出請購',
      extractData: () => {
        let selectedCategory = DOM.category.value;
        if (selectedCategory === '其他') selectedCategory = DOM.otherCategory.value;
        return {
          applicant: DOM.applicant.value,
          email: AppState.currentUserEmail,
          chineseName: DOM.chineseName.value,
          englishName: DOM.englishName.value,
          quantity: DOM.quantity.value + ' ' + DOM.unit.value,
          category: selectedCategory,
          concentration: DOM.concentration.value,
          volume: DOM.volume.value,
          usageTime: DOM.usageTime.value,
          subject: document.querySelector('input[name="subject"]:checked')?.value || '',
          remark: DOM.remark.value
        };
      }
    },
    equip: {
      submitBtnId: 'equip_submitBtn',
      fileInputId: 'equip_photoFile',
      backendFn: 'submitEquip',
      cacheKeys: ['user_equip', 'admin_equip'],
      resetFn: resetEquipForm,
      btnLoadingText: '送出申請',
      extractData: () => {
        return {
          applySubject: document.getElementById('equip_applySubject')?.value || '',
          equipName: document.getElementById('equip_name')?.value || '',
          quantity: document.getElementById('equip_quantity')?.value || '',
          price: document.getElementById('equip_price')?.value || '',
          purpose: document.getElementById('equip_purpose')?.value || '',
          isSyllabus: document.querySelector('input[name="isSyllabus"]:checked')?.value || '',
          location: document.querySelector('input[name="location"]:checked')?.value || '',
          correspondSubject: document.getElementById('equip_correspondSubject')?.value || ''
        };
      }
    },
    equipBorrow: {
      submitBtnId: 'equipBorrow_submitBtn',
      fileInputId: 'equipBorrow_photoFile',
      backendFn: 'submitEquipBorrow',
      cacheKeys: ['user_equipBorrow', 'admin_equipBorrow'],
      resetFn: resetEquipBorrowForm,
      btnLoadingText: '送出借用申請',
      extractData: () => {
        const baseItem = (document.getElementById('equipBorrow_item')?.value || '').trim();
        const propertyNumber = (document.getElementById('equipBorrow_propertyNumber')?.value || '').trim();
        const finalItem = propertyNumber ? `${baseItem} (財標序號: ${propertyNumber})` : baseItem;
        return {
          applicant: document.getElementById('equipBorrow_applicant')?.value || '',
          email: AppState.currentUserEmail,
          department: document.getElementById('equipBorrow_department')?.value || '',
          item: finalItem,
          quantity: document.getElementById('equipBorrow_quantity')?.value || '',
          purpose: document.getElementById('equipBorrow_purpose')?.value || '',
          remark: document.getElementById('equipBorrow_remark')?.value || '',
          system: 'equipBorrow'
        };
      }
    }
  };

  async function handleGenericSubmit(e, formType) {
    e.preventDefault();
    const config = FORM_CONFIG[formType];
    if (!config) return;

    const emailVal = validateUserDomain(AppState.currentUserEmail, config.btnLoadingText);
    if (!emailVal) return;

    const submitBtn = document.getElementById(config.submitBtnId);
    setSubmitButtonLoading(submitBtn, true, config.btnLoadingText);

    const fileInput = document.getElementById(config.fileInputId);
    const file = fileInput ? fileInput.files[0] : null;
    
    try {
      const photoData = await fileToBase64(file);
      const formData = config.extractData();
      if (photoData) {
        formData.photoBase64 = photoData.base64;
        formData.photoName = photoData.name;
      }

      const response = await ApiService.form[config.backendFn](formData, getToken());
      
      setSubmitButtonLoading(submitBtn, false, config.btnLoadingText);
      if (response.success) {
        alert(response.message);
        if (window.SystemCache) {
          config.cacheKeys.forEach(key => window.SystemCache.invalidate(key));
        }
        if (config.resetFn) config.resetFn();
        if (typeof refreshDatalist === 'function') refreshDatalist();
      } else {
        alert('送出失敗: ' + (response.message || '未知錯誤'));
      }
    } catch (error) {
      setSubmitButtonLoading(submitBtn, false, config.btnLoadingText);
      alert('系統錯誤: ' + (error.message || error));
    }
  }

  // 初始化所有圖片上傳區域（使用優化C的共用函數）
  document.addEventListener('DOMContentLoaded', function () {
    initDOM();

    // 藥品請購圖片區
    initImageDropZone('paste-zone', 'photoFile', '');

    // 設備申請圖片區
    initImageDropZone('equip_paste-zone', 'equip_photoFile', 'equip');

    // 設備借用圖片區
    initImageDropZone('equipBorrow_paste-zone', 'equipBorrow_photoFile', 'equipBorrow');

    // 全域貼上事件（自動識別目前使用中的表單）
    document.addEventListener('paste', function (e) {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let index in items) {
        const item = items[index];
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const blob = item.getAsFile();
          const dataTransfer = new DataTransfer();
          dataTransfer.items.add(blob);

          if (AppState.currentSystemTab === 'equipBorrow') {
            const ebFileInput = document.getElementById('equipBorrow_photoFile');
            if (ebFileInput) {
              ebFileInput.files = dataTransfer.files;
              showPreview(blob, 'equipBorrow');
            }
          } else if (AppState.currentSystemTab === 'equip') {
            const equipFileInput = document.getElementById('equip_photoFile');
            if (equipFileInput) {
              equipFileInput.files = dataTransfer.files;
              showPreview(blob, 'equip');
            }
          } else {
            const chemFileInput = document.getElementById('photoFile');
            if (chemFileInput) {
              chemFileInput.files = dataTransfer.files;
              showPreview(blob);
            }
          }

          e.preventDefault();
          break;
        }
      }
    });
  });

  // ==========================================
  // 藥品/物品 批次匯入功能
  // ==========================================
  function downloadChemTemplate() {
    if (typeof XLSX === 'undefined') {
      alert('無法載入 Excel 處理函式庫，請重新整理網頁後再試。');
      return;
    }

    // 定義範本的標題與範例資料
    const ws_data = [
      ['物品/藥品中文名稱', '藥品英文名稱(含化學式，分子量)或物品名稱', '所需數量', '物品分類/化學藥品狀態', '藥品濃度(液態)', '藥品容量(液態)', '課程使用時間', '所需科別', '備註'],
      ['氯化鈉', 'NaCl', '3 瓶', '固態(粉)', '', '', '2026/07/24', '化學', '請買試藥級']
    ];

    const ws = XLSX.utils.aoa_to_sheet(ws_data);

    // 設定欄寬
    ws['!cols'] = [
      { wch: 25 }, { wch: 40 }, { wch: 15 }, { wch: 25 }, { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 15 }, { wch: 30 }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "申請範本");

    // 下載檔案
    XLSX.writeFile(wb, "藥品物品請購範本.xlsx");
  }

  function handleChemImport(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (typeof XLSX === 'undefined') {
      alert('無法載入 Excel 處理函式庫，請重新整理網頁後再試。');
      event.target.value = ''; // 復原 input
      return;
    }

    const emailVal = validateUserDomain(AppState.currentUserEmail, '進行匯入');
    if (!emailVal) {
      event.target.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        // 取第一個工作表
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];

        // 轉為二維陣列 (加上 raw: false 強制轉為文字字串，避免日期被轉為數字)
        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, defval: "" });

        if (rows.length < 2) {
          alert('匯入失敗：檔案中沒有資料列！');
          event.target.value = '';
          return;
        }

        const validForms = [];
        const applicantVal = AppState.currentUserDisplayName || (AppState.currentUserEmail ? AppState.currentUserEmail.split('@')[0] : '');

        // 防呆：範本文字
        const templateExampleName = '氯化鈉';
        const templateExampleQty = '3 瓶';

        for (let i = 1; i < rows.length; i++) {
          let row = rows[i];
          // 如果該列為空，跳過
          if (!row || row.length === 0 || row.join('').trim() === '') continue;

          let chineseName = (row[0] || '').toString().trim();
          let englishName = (row[1] || '').toString().trim();
          let quantityStr = (row[2] || '').toString().trim();
          let category = (row[3] || '').toString().trim();
          let concentration = (row[4] || '').toString().trim();
          let volume = (row[5] || '').toString().trim();
          let usageTime = (row[6] || '').toString().trim();
          let subject = (row[7] || '').toString().trim();
          let remark = (row[8] || '').toString().trim();

          // 偵測是否為範例行，若是則跳過
          if (i === 1 && chineseName === templateExampleName && quantityStr === templateExampleQty) {
            console.log('跳過範例行');
            continue;
          }

          // 必填欄位檢查
          if (!chineseName) continue; // 沒有中文名稱的行視為無效

          validForms.push({
            applicant: applicantVal,
            email: emailVal,
            chineseName: chineseName,
            englishName: englishName,
            quantity: quantityStr,
            category: category,
            concentration: concentration,
            volume: volume,
            usageTime: usageTime,
            subject: subject,
            remark: remark,
            photoBase64: null,
            photoName: null
          });
        }

        if (validForms.length === 0) {
          alert('匯入失敗：找不到有效的申請資料！請確認是否皆為空白或僅包含範例文字。');
          event.target.value = '';
          return;
        }

        const isConfirmed = await showConfirm(`即將匯入 ${validForms.length} 筆請購資料，請確認是否繼續？`);
        if (isConfirmed) {
          // 呼叫後端批次寫入
          setSubmitButtonLoading(DOM.submitBtn, true);

          try {
            const response = await ApiService.form.batchSubmitChem(validForms, getToken());
            alert(response.message);
            setSubmitButtonLoading(DOM.submitBtn, false, '送出請購');
            event.target.value = '';
          } catch (err) {
            alert('批次匯入失敗: ' + (err.message || err));
            setSubmitButtonLoading(DOM.submitBtn, false, '送出請購');
            event.target.value = '';
          }
        } else {
          event.target.value = ''; // 取消匯入
        }
      } catch (err) {
        alert('解析 Excel 檔案發生錯誤：' + err.message);
        event.target.value = '';
      }
    };
    reader.onerror = function () {
      alert('讀取檔案失敗！');
      event.target.value = '';
    };
    reader.readAsArrayBuffer(file);
  }
</script>
