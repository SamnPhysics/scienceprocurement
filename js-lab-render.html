<script>
  // ==========================================
  // js-lab-render.html — 實驗室預約模組：渲染
  // 職責：時間軸/週表渲染、教室資訊塊
  // 包含優化D：DOM 操作改用 createElement 取代 innerHTML += 迴圈
  // 載入順序：依賴 js-lab-core.html
  // ==========================================

  // 初始化時間軸標頭 (08:00 - 18:00)，使用 DocumentFragment（優化D）
  function renderLabTimeHeader() {
    const header = document.getElementById('time-header');
    if (!header) return;
    const frag = document.createDocumentFragment();
    for (let i = LabState.config.startHour; i < LabState.config.endHour; i++) {
      const hourDiv = document.createElement('div');
      hourDiv.style.width = '10%';
      hourDiv.className = 'shrink-0 border-r border-gray-200 px-2 py-3 text-center';
      hourDiv.textContent = `${String(i).padStart(2, '0')}:00`;
      frag.appendChild(hourDiv);
    }
    header.innerHTML = '';
    header.appendChild(frag);
  }

  // 共用元件：建立左側教室資訊欄（支援點擊查看專屬一週行事曆）
  function createLabRoomInfoBlock(room) {
    const info = document.createElement('div');
    info.className = 'w-44 shrink-0 p-3 flex gap-3 border-r border-gray-200 cursor-pointer hover:bg-indigo-50/30 transition group-hover:border-indigo-100 group/info relative overflow-visible';
    info.onclick = () => openLabRoomScheduleModal(room.id);
    const floorBadgeHtml = room.floor ? renderTemplate('lab-room-floor-badge-template', { floor: room.floor }) : '';
    info.innerHTML = renderTemplate('lab-room-info-card-template', {
      image: room.image || '',
      name: room.name || '',
      capacity: room.capacity || 0,
      floorBadge: floorBadgeHtml
    });
    return info;
  }

  // 渲染日檢視時間軸（使用 filterBookingsByRoomAndDate 優化A）
  function renderLabTimeline() {
    const container = document.getElementById('rooms-container');
    const cleanCurrentDate = getLabLocalIsoDate(LabState.currentDate).trim();
    const filteredRooms = getFilteredLabRooms();

    if (filteredRooms.length === 0) {
      container.innerHTML = renderTemplate('lab-empty-state-template');
      return;
    }

    const containerFrag = document.createDocumentFragment();

    filteredRooms.forEach(room => {
      const row = document.createElement('div');
      row.className = 'flex border-b border-gray-200 bg-white timeline-row group relative';
      row.style.minHeight = '72px';

      const roomInfo = createLabRoomInfoBlock(room);
      row.appendChild(roomInfo);

      const timelineArea = document.createElement('div');
      timelineArea.className = 'flex-1 timeline-grid relative overflow-hidden flex items-center';

      // 優化D：用 DocumentFragment 建構時段格子
      const gridCellsContainer = document.createElement('div');
      gridCellsContainer.className = 'absolute inset-0 flex';
      const cellsFrag = document.createDocumentFragment();

      for (let i = LabState.config.startHour; i < LabState.config.endHour; i++) {
        const startT = `${String(i).padStart(2, '0')}:00`;
        const endT = `${String(i + 1).padStart(2, '0')}:00`;
        const cell = document.createElement('div');
        cell.style.width = '10%';
        cell.className = 'shrink-0 h-full border-r border-gray-200 hover:bg-indigo-50/60 transition duration-150 flex items-center justify-center group/cell cursor-pointer';
        cell.innerHTML = renderTemplate('lab-timeline-cell-hover-template', { startTime: startT });
        cell.onclick = (e) => {
          if (e.target.closest('.booking-block')) return;
          openLabModal(room.id, startT, endT, cleanCurrentDate);
        };
        cellsFrag.appendChild(cell);
      }
      gridCellsContainer.appendChild(cellsFrag);
      timelineArea.appendChild(gridCellsContainer);

      // 使用優化A的共用過濾函數
      const roomBookings = filterBookingsByRoomAndDate(LabState.bookings, room, cleanCurrentDate);

      roomBookings.forEach(b => {
        const pos = calculateLabTimePosition(b.start, b.end);
        const block = document.createElement('div');
        block.className = `booking-block absolute top-2 bottom-2 rounded-md px-3 py-1 shadow-sm flex flex-col justify-center cursor-pointer overflow-hidden ${getBookingColor(b)}`;
        block.style.left = `${pos.left}%`;
        block.style.width = `${pos.width}%`;
        block.innerHTML = renderTemplate('lab-timeline-booking-block-template', {
          title: b.title || '',
          start: b.start || '',
          end: b.end || '',
          user: maskName(b.user)
        });
        block.onclick = (e) => {
          e.stopPropagation();
          showLabBookingDetailModal(b, room);
        };
        timelineArea.appendChild(block);
      });

      row.appendChild(timelineArea);
      containerFrag.appendChild(row);
    });

    container.appendChild(containerFrag);
  }

  // 渲染週表網格（使用優化A和優化D）
  function renderLabWeekGrid() {
    const container = document.getElementById('rooms-container');
    const days = ['週一', '週二', '週三', '週四', '週五'];

    let dayOfWeek = LabState.currentDate.getDay();
    if (dayOfWeek === 0) dayOfWeek = 7;
    const monday = new Date(LabState.currentDate);
    monday.setDate(LabState.currentDate.getDate() - (dayOfWeek - 1));

    const todayIso = getLabLocalIsoDate(new Date()).trim();
    const filteredRooms = getFilteredLabRooms();

    if (filteredRooms.length === 0) {
      container.innerHTML = renderTemplate('lab-empty-state-template');
      return;
    }

    // 優化D：預先計算本週 5 天日期（避免內層迴圈重複計算）
    const weekDates = [];
    for (let i = 0; i < 5; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      weekDates.push(getLabLocalIsoDate(d).trim());
    }

    const containerFrag = document.createDocumentFragment();

    filteredRooms.forEach(room => {
      const row = document.createElement('div');
      row.className = 'flex border-b border-gray-200 bg-white group relative';
      row.style.minHeight = '90px';

      const roomInfo = createLabRoomInfoBlock(room);
      row.appendChild(roomInfo);

      const gridArea = document.createElement('div');
      gridArea.className = 'flex-1 week-grid cursor-pointer';

      days.forEach((day, index) => {
        const cellDateIso = weekDates[index];
        const cell = document.createElement('div');
        cell.className = 'week-cell flex flex-col justify-center items-center gap-1';

        if (cellDateIso === todayIso) cell.classList.add('bg-indigo-50/20');

        // 使用優化A的共用過濾函數
        const dayBookings = filterBookingsByRoomAndDate(LabState.bookings, room, cellDateIso);
        const bookingCount = dayBookings.length;

        if (bookingCount > 0) {
          let opacityClass = 'opacity-40';
          if (bookingCount > 3) opacityClass = 'opacity-100';
          else if (bookingCount > 1) opacityClass = 'opacity-70';

          cell.innerHTML = renderTemplate('lab-week-cell-booked-template', { opacityClass, count: bookingCount });
          cell.onclick = () => openLabWeekDetailsModal(room.id, day, cellDateIso);
        } else {
          cell.innerHTML = renderTemplate('lab-week-cell-empty-template');
          cell.onclick = () => openLabModal(room.id, '08:00', '18:00', cellDateIso);
        }

        gridArea.appendChild(cell);
      });

      row.appendChild(gridArea);
      containerFrag.appendChild(row);
    });

    container.appendChild(containerFrag);
  }
</script>
