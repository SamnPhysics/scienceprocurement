<!-- 通用資料清單組件 -->
<div id="view-datalist-container" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b pb-3">
    <h2 id="datalist-title" class="text-xl font-bold text-slate-900">清單資料</h2>
    <div class="flex flex-wrap items-center gap-3" id="datalist-toolbar">
      <!-- 過濾器 (部分選項會動態隱藏) -->
      <div class="flex items-center space-x-2 text-sm" id="datalist-filter-group">
        <span class="text-slate-500 font-medium">篩選：</span>
        <select id="datalist-filter-year" class="rounded border border-slate-300 p-1.5 text-xs bg-white focus:outline-none">
          <option value="">全部年份</option>
        </select>
        <select id="datalist-filter-month" class="rounded border border-slate-300 p-1.5 text-xs bg-white focus:outline-none">
          <option value="">全部月份</option>
          <option value="01">1 月</option>
          <option value="02">2 月</option>
          <option value="03">3 月</option>
          <option value="04">4 月</option>
          <option value="05">5 月</option>
          <option value="06">6 月</option>
          <option value="07">7 月</option>
          <option value="08">8 月</option>
          <option value="09">9 月</option>
          <option value="10">10 月</option>
          <option value="11">11 月</option>
          <option value="12">12 月</option>
        </select>
        <input type="text" id="datalist-filter-keyword" placeholder="搜尋申請者或關鍵字" class="hidden rounded border border-slate-300 p-1.5 text-xs bg-white focus:outline-none w-28 md:w-36">
      </div>
      
      <!-- 額外按鈕區 -->
      <div id="datalist-extra-buttons" class="flex items-center space-x-2">
        <button id="datalist-btn-cancel" onclick="cancelSelectedRequests()" class="hidden px-3 py-1.5 bg-rose-50 text-rose-700 rounded border border-rose-200 hover:bg-rose-100 text-sm font-medium transition">
          取消申請
        </button>
        <button id="datalist-btn-batch-update" onclick="batchUpdateAdminRequests()" class="hidden px-3 py-1.5 bg-blue-50 text-blue-700 rounded border border-blue-200 hover:bg-blue-100 text-sm font-medium transition shadow-sm flex-row items-center space-x-1">
          <svg class="w-4 h-4 mr-1 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          批次更新
        </button>
        <button id="datalist-btn-export" onclick="exportAdminDataToExcel()" class="hidden px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded border border-emerald-200 hover:bg-emerald-100 text-sm font-medium transition shadow-sm flex-row items-center space-x-1">
          <svg class="w-4 h-4 mr-1 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          匯出 Excel
        </button>
        <!-- 重新整理 -->
        <button id="datalist-btn-refresh" onclick="refreshDatalist()" class="px-3 py-1.5 bg-slate-100 text-slate-700 rounded border hover:bg-slate-200 text-sm font-medium transition">
          重新整理
        </button>
      </div>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse text-sm">
      <thead id="datalist-thead" class="bg-slate-100 border-b border-slate-200 text-slate-700 font-semibold">
        <!-- JS 動態寫入表頭 -->
      </thead>
      <tbody id="datalist-tbody" class="divide-y divide-slate-100 text-slate-600">
        <!-- JS 動態寫入資料 -->
      </tbody>
    </table>
  </div>

  <!-- 分頁控制 -->
  <div id="datalist-pagination-container"></div>
</div>
