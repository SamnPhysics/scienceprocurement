<script>
  // ==========================================
  // js-ui-widgets.html — UI 元件
  // 職責：PageNav、DataTableManager、window.alert 覆寫、showConfirm
  // 載入順序：依賴 js-core.html（debounce）
  // ==========================================

  class PageNav {
    constructor(containerId, options) {
      this.containerId = containerId;
      this.options = options || {};
      this.onPageChange = this.options.onPageChange || function () { };
      this.onPageSizeChange = this.options.onPageSizeChange || function () { };
      this.pageSizeOptions = this.options.pageSizeOptions || [10, 20, 30, 50];

      const c = document.getElementById(this.containerId);
      if (c) {
        c.className = "flex flex-col sm:flex-row justify-between items-center mt-6 pt-4 border-t border-slate-100 gap-4 text-sm text-slate-600";
      }
    }

    render(currentPage, totalPages, totalItems, currentSize) {
      const container = document.getElementById(this.containerId);
      if (!container) return;

      if (totalItems === 0) {
        container.innerHTML = `
          <div class="flex items-center space-x-2 opacity-50">
            <span>每頁顯示</span>
            <select disabled class="rounded border p-1 text-xs bg-gray-100 focus:outline-none">
              <option>10 筆</option>
            </select>
          </div>
          <div class="flex items-center space-x-4 opacity-50">
            <button disabled class="px-3 py-1 bg-slate-100 border rounded cursor-not-allowed">上一頁</button>
            <span class="font-medium">第 0 / 0 頁</span>
            <button disabled class="px-3 py-1 bg-slate-100 border rounded cursor-not-allowed">下一頁</button>
          </div>
        `;
        return;
      }

      const prevDisabled = currentPage <= 1 ? 'disabled class="px-3 py-1 bg-slate-100 border rounded opacity-50 cursor-not-allowed"' : 'class="px-3 py-1 bg-slate-100 border hover:bg-slate-200 rounded transition"';
      const nextDisabled = currentPage >= totalPages ? 'disabled class="px-3 py-1 bg-slate-100 border rounded opacity-50 cursor-not-allowed"' : 'class="px-3 py-1 bg-slate-100 border hover:bg-slate-200 rounded transition"';

      const sizeOptions = this.pageSizeOptions.map(size =>
        `<option value="${size}" ${size === currentSize ? 'selected' : ''}>${size} 筆</option>`
      ).join('');

      container.innerHTML = `
        <div class="flex items-center space-x-2">
          <span>每頁顯示</span>
          <select id="pagenav-size-${this.containerId}" class="rounded border p-1 text-xs bg-white focus:outline-none">
            ${sizeOptions}
          </select>
        </div>
        <div class="flex items-center space-x-4">
          <button id="pagenav-prev-${this.containerId}" ${prevDisabled}>上一頁</button>
          <span class="font-medium">第 ${currentPage} / ${totalPages} 頁 <span class="text-xs text-slate-400 ml-1 hidden sm:inline">(共 ${totalItems} 筆)</span></span>
          <button id="pagenav-next-${this.containerId}" ${nextDisabled}>下一頁</button>
        </div>
      `;

      const selectEl = document.getElementById(`pagenav-size-${this.containerId}`);
      if (selectEl) {
        selectEl.addEventListener('change', (e) => {
          this.onPageSizeChange(parseInt(e.target.value));
        });
      }

      const prevEl = document.getElementById(`pagenav-prev-${this.containerId}`);
      if (prevEl && currentPage > 1) {
        prevEl.addEventListener('click', () => { this.onPageChange(currentPage - 1); });
      }

      const nextEl = document.getElementById(`pagenav-next-${this.containerId}`);
      if (nextEl && currentPage < totalPages) {
        nextEl.addEventListener('click', () => { this.onPageChange(currentPage + 1); });
      }
    }
  }

  class DataTableManager {
    constructor(config) {
      DataTableManager.initOverlays();
      this.config = config;
      this.rawData = [];
      this.filteredData = [];
      this.currentPage = 1;
      this.pageSize = 10;
      this.pageNav = config.pageNav || null;
      this.bindEvents();
    }

    bindEvents() {
      const c = this.config;
      if (c.yearFilterId) {
        const el = document.getElementById(c.yearFilterId);
        if (el) el.addEventListener('change', () => this.applyFilters());
      }
      if (c.monthFilterId) {
        const el = document.getElementById(c.monthFilterId);
        if (el) el.addEventListener('change', () => this.applyFilters());
      }
      if (c.applicantFilterId) {
        const el = document.getElementById(c.applicantFilterId);
        if (el) el.addEventListener('input', debounce(() => this.applyFilters(), 300));
      }
    }

    setData(data) {
      this.rawData = data || [];
      if (this.config.yearFilterId) {
        populateYearFilters(this.rawData, this.config.yearFilterId);
      }
      this.applyFilters();
    }

    applyFilters() {
      const c = this.config;
      const year = c.yearFilterId ? document.getElementById(c.yearFilterId).value : '';
      const month = c.monthFilterId ? document.getElementById(c.monthFilterId).value : '';
      const applicantKeyword = c.applicantFilterId ? document.getElementById(c.applicantFilterId).value.toLowerCase().trim() : '';

      this.filteredData = this.rawData.filter(item => {
        if (!filterByDate(item, year, month)) return false;
        if (applicantKeyword) {
          const matchKeyword = String(item.applicant || '').toLowerCase().indexOf(applicantKeyword) !== -1 ||
            String(item.email || '').toLowerCase().indexOf(applicantKeyword) !== -1 ||
            String(item.subject || '').toLowerCase().indexOf(applicantKeyword) !== -1 ||
            String(item.chineseName || '').toLowerCase().indexOf(applicantKeyword) !== -1;
          if (!matchKeyword) return false;
        }
        return true;
      });

      this.currentPage = 1;
      this.render();
    }

    render() {
      const tbody = document.getElementById(this.config.tableBodyId);
      const totalItems = this.filteredData.length;

      if (totalItems === 0) {
        tbody.innerHTML = `<tr><td colspan="${this.config.colSpan || 8}" class="p-4 text-center text-slate-400">目前尚無符合的資料</td></tr>`;
        if (this.pageNav) this.pageNav.render(this.currentPage, 0, 0, this.pageSize);
        return;
      }

      const totalPages = Math.ceil(totalItems / this.pageSize);
      if (this.currentPage > totalPages) this.currentPage = totalPages;
      if (this.currentPage < 1) this.currentPage = 1;

      const startIdx = (this.currentPage - 1) * this.pageSize;
      const endIdx = Math.min(startIdx + this.pageSize, totalItems);
      const pageItems = this.filteredData.slice(startIdx, endIdx);

      let html = '';
      let pageSum = 0;

      pageItems.forEach((item, index) => {
        html += this.config.renderRow(item, index);
        if (this.config.calculateSum) {
          const sumField = this.config.sumField || 'totalPrice';
          pageSum += parseFloat(item[sumField]) || 0;
        }
      });

      if (this.config.calculateSum) {
        const sumTitle = this.config.sumTitle || '本頁採購總價加總：';
        html += `
            <tr class="bg-slate-100 font-semibold text-slate-900 border-t border-slate-200">
              <td colspan="${(this.config.colSpan || 8) - 1}" class="p-3 text-right">${sumTitle}</td>
              <td class="p-3 text-center text-rose-600">${pageSum} 元</td>
            </tr>
          `;
      }

      tbody.innerHTML = html;

      if (this.pageNav) {
        this.pageNav.render(this.currentPage, totalPages, totalItems, this.pageSize);
      }

      if (this.config.onRender) this.config.onRender();
    }

    prevPage() {
      if (this.currentPage > 1) { this.currentPage--; this.render(); }
    }

    nextPage() {
      const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
      if (this.currentPage < totalPages) { this.currentPage++; this.render(); }
    }

    static isTooltipEnabled() {
      return !AppState.features || AppState.features.tooltip !== false;
    }

    static initOverlays() {
      DataTableManager.initImageModal();
      if (DataTableManager.isTooltipEnabled()) {
        DataTableManager.initTooltip();
      }
    }

    static initImageModal() {
      if (document.getElementById('image-modal')) return;

      const imageModalHtml = `
          <div id="image-modal" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/70 backdrop-blur-sm transition-opacity duration-200 opacity-0" onclick="closeImageModal()">
            <div class="relative max-w-4xl max-h-[90vh] w-[90%] mx-auto bg-white rounded-lg shadow-2xl p-2 flex flex-col items-center transform scale-95 transition-transform duration-200" onclick="event.stopPropagation()">
              <button onclick="closeImageModal()" class="absolute top-2 right-2 w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
                <i class="fa-solid fa-xmark"></i>
              </button>
              <img id="image-modal-img" src="" class="w-full h-auto object-contain max-h-[85vh] rounded" alt="放大圖片" referrerpolicy="no-referrer">
            </div>
          </div>
        `;
      document.body.insertAdjacentHTML('beforeend', imageModalHtml);
    }

    static initTooltip() {
      if (document.getElementById('custom-tooltip')) return;

      const tooltipHtml = `
          <div id="custom-tooltip" class="fixed hidden z-[100] bg-white border border-slate-200 shadow-2xl rounded-lg p-3 max-w-[280px] w-max pointer-events-none transition-opacity duration-150 opacity-0">
            <div id="tooltip-remark" class="text-sm text-slate-700 font-medium whitespace-pre-wrap mb-2 leading-relaxed"></div>
            <div id="tooltip-photo-container" class="hidden">
              <img id="tooltip-photo" src="" alt="照片預覽" class="w-full h-auto rounded border border-slate-100 object-contain max-h-48" referrerpolicy="no-referrer">
            </div>
            <div id="tooltip-no-photo" class="text-xs text-slate-400 italic hidden">無上傳照片</div>
          </div>
        `;
      document.body.insertAdjacentHTML('beforeend', tooltipHtml);

      DataTableManager.tooltipEl = document.getElementById('custom-tooltip');
      DataTableManager.tooltipRemark = document.getElementById('tooltip-remark');
      DataTableManager.tooltipPhotoContainer = document.getElementById('tooltip-photo-container');
      DataTableManager.tooltipPhoto = document.getElementById('tooltip-photo');
      DataTableManager.tooltipNoPhoto = document.getElementById('tooltip-no-photo');

      if (DataTableManager.tooltipEventsBound) return;
      DataTableManager.tooltipEventsBound = true;

      document.body.addEventListener('mouseover', (e) => {
        if (e.target.closest('button, input, select')) { DataTableManager.hideTooltip(); return; }
        const tr = e.target.closest('tr.tooltip-trigger');
        if (tr) DataTableManager.showTooltip(tr);
      });
      document.body.addEventListener('mousemove', (e) => {
        if (e.target.closest('button, input, select')) return;
        const tr = e.target.closest('tr.tooltip-trigger');
        if (tr) DataTableManager.moveTooltip(e);
      });
      document.body.addEventListener('mouseout', (e) => {
        if (e.target.closest('button, input, select')) return;
        const tr = e.target.closest('tr.tooltip-trigger');
        if (tr && !tr.contains(e.relatedTarget)) DataTableManager.hideTooltip();
      });
    }

    static showTooltip(element) {
      const tooltip = DataTableManager.tooltipEl;
      if (!tooltip) return;

      const remark = element.getAttribute('data-remark');
      const photoUrl = element.getAttribute('data-photo');
      const title = element.getAttribute('data-title') || '備註：';

      DataTableManager.tooltipRemark.textContent = title + '\n' + remark;

      if (photoUrl && photoUrl !== '無照片') {
        DataTableManager.tooltipPhoto.src = window.getDriveImageUrl(photoUrl, 500);
        DataTableManager.tooltipPhotoContainer.classList.remove('hidden');
        DataTableManager.tooltipNoPhoto.classList.add('hidden');
      } else {
        DataTableManager.tooltipPhoto.src = '';
        DataTableManager.tooltipPhotoContainer.classList.add('hidden');
        DataTableManager.tooltipNoPhoto.classList.remove('hidden');
      }

      tooltip.classList.remove('hidden');
      void tooltip.offsetWidth;
      tooltip.classList.remove('opacity-0');
    }

    static moveTooltip(event) {
      const tooltip = DataTableManager.tooltipEl;
      if (!tooltip || tooltip.classList.contains('hidden')) return;

      let x = event.clientX + 15;
      let y = event.clientY + 15;
      const rect = tooltip.getBoundingClientRect();
      if (x + rect.width > window.innerWidth) x = event.clientX - rect.width - 15;
      if (y + rect.height > window.innerHeight) y = event.clientY - rect.height - 15;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    }

    static hideTooltip() {
      const tooltip = DataTableManager.tooltipEl;
      if (!tooltip) return;
      tooltip.classList.add('opacity-0');
      setTimeout(() => {
        if (tooltip.classList.contains('opacity-0')) tooltip.classList.add('hidden');
      }, 150);
    }
  }

  let datalistManager;

  function initDataListManager() {
    if (datalistManager) return datalistManager;
    const pageContainer = document.getElementById('datalist-pagination-container');
    const tableBody = document.getElementById('datalist-tbody');
    if (!pageContainer || !tableBody) return null;

    const pageNav = new PageNav('datalist-pagination-container', {
      onPageChange: (newPage) => {
        if (datalistManager) { datalistManager.currentPage = newPage; datalistManager.render(); }
      },
      onPageSizeChange: (newSize) => {
        if (datalistManager) { datalistManager.pageSize = newSize; datalistManager.currentPage = 1; datalistManager.render(); }
      }
    });

    datalistManager = new DataTableManager({
      tableBodyId: 'datalist-tbody',
      pageNav: pageNav,
      yearFilterId: 'datalist-filter-year',
      monthFilterId: 'datalist-filter-month',
      applicantFilterId: 'datalist-filter-keyword',
      colSpan: 8,
      calculateSum: false,
      renderRow: function (item, index) { return ''; }
    });

    return datalistManager;
  }

  window.ensureDatalistManager = initDataListManager;

  document.addEventListener("DOMContentLoaded", () => {
    // 點擊空白處關閉下拉選單
    document.addEventListener('click', function (e) {
      const btnAuth = document.getElementById('btn-login-logout');
      const dropdownMenu = document.getElementById('user-dropdown-menu');
      if (!dropdownMenu || dropdownMenu.classList.contains('hidden')) return;
      if (btnAuth && !btnAuth.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.add('hidden');
      }
    });

    initDataListManager();
  });
</script>
