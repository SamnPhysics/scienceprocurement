<script>
  // ==========================================
  // js-ui-widgets.html — UI 元件
  // 職責：PageNav、DataTableManager、window.alert 覆寫、showConfirm
  // 載入順序：依賴 js-core.html（debounce）
  // ==========================================

  class PageNav {
    constructor(containerId, options) {
      this.containerId = containerId;
      this.options = options || {};
      this.onPageChange = this.options.onPageChange || function () { };
      this.onPageSizeChange = this.options.onPageSizeChange || function () { };
      this.pageSizeOptions = this.options.pageSizeOptions || [10, 20, 30, 50];

      const c = document.getElementById(this.containerId);
      if (c) {
        c.className = "flex flex-col sm:flex-row justify-between items-center mt-6 pt-4 border-t border-slate-100 gap-4 text-sm text-slate-600";
      }
    }

    render(currentPage, totalPages, totalItems, currentSize) {
      const container = document.getElementById(this.containerId);
      if (!container) return;

      if (totalItems === 0) {
        container.innerHTML = `
          <div class="flex items-center space-x-2 opacity-50">
            <span>每頁顯示</span>
            <select disabled class="rounded border p-1 text-xs bg-gray-100 focus:outline-none">
              <option>10 筆</option>
            </select>
          </div>
          <div class="flex items-center space-x-4 opacity-50">
            <button disabled class="px-3 py-1 bg-slate-100 border rounded cursor-not-allowed">上一頁</button>
            <span class="font-medium">第 0 / 0 頁</span>
            <button disabled class="px-3 py-1 bg-slate-100 border rounded cursor-not-allowed">下一頁</button>
          </div>
        `;
        return;
      }

      const prevDisabled = currentPage <= 1 ? 'disabled class="px-3 py-1 bg-slate-100 border rounded opacity-50 cursor-not-allowed"' : 'class="px-3 py-1 bg-slate-100 border hover:bg-slate-200 rounded transition"';
      const nextDisabled = currentPage >= totalPages ? 'disabled class="px-3 py-1 bg-slate-100 border rounded opacity-50 cursor-not-allowed"' : 'class="px-3 py-1 bg-slate-100 border hover:bg-slate-200 rounded transition"';

      const sizeOptions = this.pageSizeOptions.map(size =>
        `<option value="${size}" ${size === currentSize ? 'selected' : ''}>${size} 筆</option>`
      ).join('');

      container.innerHTML = `
        <div class="flex items-center space-x-2">
          <span>每頁顯示</span>
          <select id="pagenav-size-${this.containerId}" class="rounded border p-1 text-xs bg-white focus:outline-none">
            ${sizeOptions}
          </select>
        </div>
        <div class="flex items-center space-x-4">
          <button id="pagenav-prev-${this.containerId}" ${prevDisabled}>上一頁</button>
          <span class="font-medium">第 ${currentPage} / ${totalPages} 頁 <span class="text-xs text-slate-400 ml-1 hidden sm:inline">(共 ${totalItems} 筆)</span></span>
          <button id="pagenav-next-${this.containerId}" ${nextDisabled}>下一頁</button>
        </div>
      `;

      const selectEl = document.getElementById(`pagenav-size-${this.containerId}`);
      if (selectEl) {
        selectEl.addEventListener('change', (e) => {
          this.onPageSizeChange(parseInt(e.target.value));
        });
      }

      const prevEl = document.getElementById(`pagenav-prev-${this.containerId}`);
      if (prevEl && currentPage > 1) {
        prevEl.addEventListener('click', () => { this.onPageChange(currentPage - 1); });
      }

      const nextEl = document.getElementById(`pagenav-next-${this.containerId}`);
      if (nextEl && currentPage < totalPages) {
        nextEl.addEventListener('click', () => { this.onPageChange(currentPage + 1); });
      }
    }
  }

  class DataTableManager {
    constructor(config) {
      DataTableManager.initOverlays();
      this.config = config;
      this.rawData = [];
      this.filteredData = [];
      this.currentPage = 1;
      this.pageSize = 10;
      this.pageNav = config.pageNav || null;
      this.bindEvents();
    }

    bindEvents() {
      const c = this.config;
      if (c.yearFilterId) {
        const el = document.getElementById(c.yearFilterId);
        if (el) el.addEventListener('change', () => this.applyFilters());
      }
      if (c.monthFilterId) {
        const el = document.getElementById(c.monthFilterId);
        if (el) el.addEventListener('change', () => this.applyFilters());
      }
      if (c.applicantFilterId) {
        const el = document.getElementById(c.applicantFilterId);
        if (el) el.addEventListener('input', debounce(() => this.applyFilters(), 300));
      }
    }

    setData(data) {
      this.rawData = data || [];
      if (this.config.yearFilterId) {
        populateYearFilters(this.rawData, this.config.yearFilterId);
      }
      this.applyFilters();
    }

    applyFilters() {
      const c = this.config;
      const year = c.yearFilterId ? document.getElementById(c.yearFilterId).value : '';
      const month = c.monthFilterId ? document.getElementById(c.monthFilterId).value : '';
      const applicantKeyword = c.applicantFilterId ? document.getElementById(c.applicantFilterId).value.toLowerCase().trim() : '';

      this.filteredData = this.rawData.filter(item => {
        if (!filterByDate(item, year, month)) return false;
        if (applicantKeyword) {
          const matchKeyword = String(item.applicant || '').toLowerCase().indexOf(applicantKeyword) !== -1 ||
            String(item.email || '').toLowerCase().indexOf(applicantKeyword) !== -1 ||
            String(item.subject || '').toLowerCase().indexOf(applicantKeyword) !== -1 ||
            String(item.chineseName || '').toLowerCase().indexOf(applicantKeyword) !== -1;
          if (!matchKeyword) return false;
        }
        return true;
      });

      this.currentPage = 1;
      this.render();
    }

    render() {
      const tbody = document.getElementById(this.config.tableBodyId);
      const totalItems = this.filteredData.length;

      if (totalItems === 0) {
        tbody.innerHTML = `<tr><td colspan="${this.config.colSpan || 8}" class="p-4 text-center text-slate-400">目前尚無符合的資料</td></tr>`;
        if (this.pageNav) this.pageNav.render(this.currentPage, 0, 0, this.pageSize);
        return;
      }

      const totalPages = Math.ceil(totalItems / this.pageSize);
      if (this.currentPage > totalPages) this.currentPage = totalPages;
      if (this.currentPage < 1) this.currentPage = 1;

      const startIdx = (this.currentPage - 1) * this.pageSize;
      const endIdx = Math.min(startIdx + this.pageSize, totalItems);
      const pageItems = this.filteredData.slice(startIdx, endIdx);

      let html = '';
      let pageSum = 0;

      pageItems.forEach((item, index) => {
        html += this.config.renderRow(item, index);
        if (this.config.calculateSum) {
          const sumField = this.config.sumField || 'totalPrice';
          pageSum += parseFloat(item[sumField]) || 0;
        }
      });

      if (this.config.calculateSum) {
        const sumTitle = this.config.sumTitle || '本頁採購總價加總：';
        html += `
            <tr class="bg-slate-100 font-semibold text-slate-900 border-t border-slate-200">
              <td colspan="${(this.config.colSpan || 8) - 1}" class="p-3 text-right">${sumTitle}</td>
              <td class="p-3 text-center text-rose-600">${pageSum} 元</td>
            </tr>
          `;
      }

      tbody.innerHTML = html;

      if (this.pageNav) {
        this.pageNav.render(this.currentPage, totalPages, totalItems, this.pageSize);
      }

      if (this.config.onRender) this.config.onRender();
    }

    prevPage() {
      if (this.currentPage > 1) { this.currentPage--; this.render(); }
    }

    nextPage() {
      const totalPages = Math.ceil(this.filteredData.length / this.pageSize);
      if (this.currentPage < totalPages) { this.currentPage++; this.render(); }
    }

    static isTooltipEnabled() {
      return !window.APP_FEATURES || window.APP_FEATURES.tooltip !== false;
    }

    static initOverlays() {
      DataTableManager.initImageModal();
      if (DataTableManager.isTooltipEnabled()) {
        DataTableManager.initTooltip();
      }
    }

    static initImageModal() {
      if (document.getElementById('image-modal')) return;

      const imageModalHtml = `
          <div id="image-modal" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/70 backdrop-blur-sm transition-opacity duration-300 opacity-0" onclick="closeImageModal()">
            <div class="relative max-w-4xl max-h-[90vh] w-[90%] mx-auto bg-white rounded-lg shadow-2xl p-2 flex flex-col items-center transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
              <button onclick="closeImageModal()" class="absolute top-2 right-2 w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
                <i class="fa-solid fa-xmark"></i>
              </button>
              <img id="image-modal-img" src="" class="w-full h-auto object-contain max-h-[85vh] rounded" alt="放大圖片" referrerpolicy="no-referrer">
            </div>
          </div>
        `;
      document.body.insertAdjacentHTML('beforeend', imageModalHtml);
    }

    static initTooltip() {
      if (document.getElementById('custom-tooltip')) return;

      const tooltipHtml = `
          <div id="custom-tooltip" class="fixed hidden z-[100] bg-white border border-slate-200 shadow-2xl rounded-lg p-3 max-w-[280px] w-max pointer-events-none transition-opacity duration-150 opacity-0">
            <div id="tooltip-remark" class="text-sm text-slate-700 font-medium whitespace-pre-wrap mb-2 leading-relaxed"></div>
            <div id="tooltip-photo-container" class="hidden">
              <img id="tooltip-photo" src="" alt="照片預覽" class="w-full h-auto rounded border border-slate-100 object-contain max-h-48" referrerpolicy="no-referrer">
            </div>
            <div id="tooltip-no-photo" class="text-xs text-slate-400 italic hidden">無上傳照片</div>
          </div>
        `;
      document.body.insertAdjacentHTML('beforeend', tooltipHtml);

      DataTableManager.tooltipEl = document.getElementById('custom-tooltip');
      DataTableManager.tooltipRemark = document.getElementById('tooltip-remark');
      DataTableManager.tooltipPhotoContainer = document.getElementById('tooltip-photo-container');
      DataTableManager.tooltipPhoto = document.getElementById('tooltip-photo');
      DataTableManager.tooltipNoPhoto = document.getElementById('tooltip-no-photo');

      if (DataTableManager.tooltipEventsBound) return;
      DataTableManager.tooltipEventsBound = true;

      document.body.addEventListener('mouseover', (e) => {
        if (e.target.closest('button, input, select')) { DataTableManager.hideTooltip(); return; }
        const tr = e.target.closest('tr.tooltip-trigger');
        if (tr) DataTableManager.showTooltip(tr);
      });
      document.body.addEventListener('mousemove', (e) => {
        if (e.target.closest('button, input, select')) return;
        const tr = e.target.closest('tr.tooltip-trigger');
        if (tr) DataTableManager.moveTooltip(e);
      });
      document.body.addEventListener('mouseout', (e) => {
        if (e.target.closest('button, input, select')) return;
        const tr = e.target.closest('tr.tooltip-trigger');
        if (tr && !tr.contains(e.relatedTarget)) DataTableManager.hideTooltip();
      });
    }

    static showTooltip(element) {
      const tooltip = DataTableManager.tooltipEl;
      if (!tooltip) return;

      const remark = element.getAttribute('data-remark');
      const photoUrl = element.getAttribute('data-photo');
      const title = element.getAttribute('data-title') || '備註：';

      DataTableManager.tooltipRemark.textContent = title + '\n' + remark;

      if (photoUrl && photoUrl !== '無照片') {
        DataTableManager.tooltipPhoto.src = window.getDriveImageUrl(photoUrl, 500);
        DataTableManager.tooltipPhotoContainer.classList.remove('hidden');
        DataTableManager.tooltipNoPhoto.classList.add('hidden');
      } else {
        DataTableManager.tooltipPhoto.src = '';
        DataTableManager.tooltipPhotoContainer.classList.add('hidden');
        DataTableManager.tooltipNoPhoto.classList.remove('hidden');
      }

      tooltip.classList.remove('hidden');
      void tooltip.offsetWidth;
      tooltip.classList.remove('opacity-0');
    }

    static moveTooltip(event) {
      const tooltip = DataTableManager.tooltipEl;
      if (!tooltip || tooltip.classList.contains('hidden')) return;

      let x = event.clientX + 15;
      let y = event.clientY + 15;
      const rect = tooltip.getBoundingClientRect();
      if (x + rect.width > window.innerWidth) x = event.clientX - rect.width - 15;
      if (y + rect.height > window.innerHeight) y = event.clientY - rect.height - 15;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    }

    static hideTooltip() {
      const tooltip = DataTableManager.tooltipEl;
      if (!tooltip) return;
      tooltip.classList.add('opacity-0');
      setTimeout(() => {
        if (tooltip.classList.contains('opacity-0')) tooltip.classList.add('hidden');
      }, 150);
    }
  }

  let datalistManager;

  function initDataListManager() {
    if (datalistManager) return datalistManager;
    const pageContainer = document.getElementById('datalist-pagination-container');
    const tableBody = document.getElementById('datalist-tbody');
    if (!pageContainer || !tableBody) return null;

    const pageNav = new PageNav('datalist-pagination-container', {
      onPageChange: (newPage) => {
        if (datalistManager) { datalistManager.currentPage = newPage; datalistManager.render(); }
      },
      onPageSizeChange: (newSize) => {
        if (datalistManager) { datalistManager.pageSize = newSize; datalistManager.currentPage = 1; datalistManager.render(); }
      }
    });

    datalistManager = new DataTableManager({
      tableBodyId: 'datalist-tbody',
      pageNav: pageNav,
      yearFilterId: 'datalist-filter-year',
      monthFilterId: 'datalist-filter-month',
      applicantFilterId: 'datalist-filter-keyword',
      colSpan: 8,
      calculateSum: false,
      renderRow: function (item, index) { return ''; }
    });

    return datalistManager;
  }

  window.ensureDatalistManager = initDataListManager;

  document.addEventListener("DOMContentLoaded", () => {
    // 點擊空白處關閉下拉選單
    document.addEventListener('click', function (e) {
      const btnAuth = document.getElementById('btn-login-logout');
      const dropdownMenu = document.getElementById('user-dropdown-menu');
      if (!dropdownMenu || dropdownMenu.classList.contains('hidden')) return;
      if (btnAuth && !btnAuth.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.add('hidden');
      }
    });

    initDataListManager();
  });

  // 取消教室預約處理函數
  async function handleCancelLabBooking(booking) {
    const dialog = document.getElementById('custom-alert-dialog');
    
    let cancelMode = 'abort';
    
    if (booking.groupId) {
      // 週期性預約的確認視窗
      cancelMode = await new Promise((resolve) => {
        let recDialog = document.getElementById('recurring-cancel-dialog');
        if (!recDialog) {
          const html = `
            <dialog id="recurring-cancel-dialog" class="backdrop:bg-slate-900/50 backdrop:backdrop-blur-sm rounded-xl shadow-2xl p-0 border-0 m-auto min-w-[320px] max-w-md w-full transition-all duration-200 transform scale-95 opacity-0">
              <div class="bg-white rounded-xl overflow-hidden">
                <div class="px-6 py-5">
                  <div class="flex items-center gap-3 text-rose-600 mb-3">
                    <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                    <h3 class="text-lg font-semibold text-slate-900">取消週期性預約</h3>
                  </div>
                  <p class="text-slate-600 mb-2">此預約為週期性預約的一部分。</p>
                  <p class="text-slate-600 text-sm">請問您要僅取消「這一次」的預約，還是要取消「未來的所有」關聯預約？此動作無法復原。</p>
                </div>
                <div class="px-6 py-4 bg-slate-50 flex flex-col gap-2">
                  <button type="button" id="rec-cancel-series-btn" class="w-full px-4 py-2 bg-rose-600 text-white rounded-lg hover:bg-rose-700 transition font-medium shadow-sm">取消全部 (未來所有關聯預約)</button>
                  <button type="button" id="rec-cancel-single-btn" class="w-full px-4 py-2 bg-slate-200 text-slate-800 rounded-lg hover:bg-slate-300 transition font-medium">僅取消本次</button>
                  <button type="button" id="rec-cancel-abort-btn" class="w-full px-4 py-2 mt-2 text-slate-500 hover:text-slate-700 transition font-medium">不取消 (返回)</button>
                </div>
              </div>
            </dialog>
          `;
          document.body.insertAdjacentHTML('beforeend', html);
          recDialog = document.getElementById('recurring-cancel-dialog');
        }
        
        const closeDiag = (res) => {
          recDialog.classList.remove('opacity-100', 'scale-100');
          recDialog.classList.add('opacity-0', 'scale-95');
          setTimeout(() => { if (recDialog.open) recDialog.close(); resolve(res); }, 200);
        };
        
        document.getElementById('rec-cancel-series-btn').onclick = () => closeDiag('series');
        document.getElementById('rec-cancel-single-btn').onclick = () => closeDiag('single');
        document.getElementById('rec-cancel-abort-btn').onclick = () => closeDiag('abort');
        
        recDialog.showModal();
        recDialog.classList.remove('opacity-0', 'scale-95');
        recDialog.classList.add('opacity-100', 'scale-100');
      });
      if (cancelMode === 'abort') return;
    } else {
      const isConfirmed = await showConfirm(`您確定要取消「${booking.title}」於 ${booking.date} (${booking.start}-${booking.end}) 的預約嗎？此動作無法復原。`);
      if (!isConfirmed) return;
      cancelMode = 'single';
    }

    const cancelBtn = document.getElementById('custom-alert-cancel-booking-btn');
    if (cancelBtn) { cancelBtn.textContent = '處理中...'; cancelBtn.disabled = true; }

    const onSuccess = function (res) {
      if (cancelBtn) { cancelBtn.textContent = '取消預約'; cancelBtn.disabled = false; }
      if (dialog) {
        dialog.classList.remove('opacity-100', 'scale-100');
        dialog.classList.add('opacity-0', 'scale-95');
        if (dialog.open) dialog.close();
      }
      if (res.success) {
        alert(cancelMode === 'series' ? '已成功取消該系列未來的所有教室預約！' : '已成功取消該次教室預約！');
        if (typeof fetchLabBackendData === 'function') fetchLabBackendData();
      } else {
        alert('取消失敗：' + (res.message || '未知錯誤'));
      }
    };

    const onFailure = function (err) {
      if (cancelBtn) { cancelBtn.textContent = '取消預約'; cancelBtn.disabled = false; }
      alert('連線失敗，無法取消：' + (err && err.message ? err.message : err));
    };

    if (typeof google !== 'undefined' && google.script && typeof getToken === 'function') {
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .cancelLabBooking(booking.rowNumber, getToken(), cancelMode === 'series');
    } else {
      if (dialog) {
        dialog.classList.remove('opacity-100', 'scale-100');
        dialog.classList.add('opacity-0', 'scale-95');
        if (dialog.open) dialog.close();
      }
      alert('本地測試：已成功發送取消申請紀錄 (列號 ' + booking.rowNumber + ', cancelSeries: ' + (cancelMode === 'series') + ')');
    }
  }

  // 覆寫瀏覽器預設的 alert 視窗，使用精美的客製化 Modal
  window.alert = function (message, customTitle = null, customOptions = null) {
    const dialog = document.getElementById('custom-alert-dialog');
    if (!dialog) return;

    const msgEl = document.getElementById('custom-alert-message');
    const iconContainer = document.getElementById('alert-icon-container');
    const closeBtn = document.getElementById('custom-alert-close-btn');
    const xBtn = document.getElementById('custom-alert-x-btn');
    const titleEl = document.getElementById('customAlertTitle');
    const cancelWrapper = document.getElementById('custom-alert-cancel-wrapper');
    const cancelBtn = document.getElementById('custom-alert-cancel-booking-btn');

    if (titleEl) titleEl.innerText = customTitle || "系統提示";

    const msgStr = String(message);
    if (customTitle === '實驗室/教室 預約明細' || msgStr.indexOf('預約明細') !== -1) {
      iconContainer.className = "flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-indigo-100 text-indigo-600";
      iconContainer.innerHTML = `<svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>`;
    } else if (msgStr.indexOf('失敗') !== -1 || msgStr.indexOf('錯誤') !== -1 || msgStr.indexOf('無法') !== -1) {
      iconContainer.className = "flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-rose-100 text-rose-600 animate-pulse";
      iconContainer.innerHTML = `<svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>`;
    } else if (msgStr.indexOf('成功') !== -1) {
      iconContainer.className = "flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-emerald-100 text-emerald-600";
      iconContainer.innerHTML = `<svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>`;
    } else {
      iconContainer.className = "flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-amber-100 text-amber-600";
      iconContainer.innerHTML = `<svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`;
    }

    if (cancelWrapper && cancelBtn) {
      if (customTitle === '實驗室/教室 預約明細' && customOptions && customOptions.booking) {
        cancelWrapper.classList.remove('hidden');
        const booking = customOptions.booking;
        const email = (typeof currentUserEmail !== 'undefined' ? currentUserEmail : (window.currentUserEmail || '')).toLowerCase().trim();
        const displayName = (typeof currentUserDisplayName !== 'undefined' ? currentUserDisplayName : (window.currentUserDisplayName || (email ? email.split('@')[0] : ''))).toLowerCase().trim();
        const role = window.currentAuthRole || 'guest';
        const isAdmin = (role === 'admin');

        const bEmail = String(booking.email || '').toLowerCase().trim();
        const bTeacher = String(booking.teacher || '').toLowerCase().trim();
        const bStudent = String(booking.student || '').toLowerCase().trim();
        const bUser = String(booking.user || '').toLowerCase().trim();

        const isOwner = email && (
          (bEmail !== '' && bEmail === email) ||
          (bUser !== '' && (bUser === displayName || bUser === email.split('@')[0])) ||
          (bTeacher !== '' && (bTeacher === displayName || bTeacher === email.split('@')[0])) ||
          (bStudent !== '' && (bStudent === displayName || bStudent === email.split('@')[0]))
        );

        if (isAdmin || isOwner) {
          cancelWrapper.removeAttribute('title');
          cancelWrapper.className = "inline-block";
          cancelBtn.className = "px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-sm font-semibold transition shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2 cursor-pointer";
          cancelBtn.disabled = false;
          cancelBtn.onclick = function () {
            handleCancelLabBooking(booking);
          };
        } else {
          cancelWrapper.setAttribute('title', '不能取消其他人預約');
          cancelWrapper.className = "inline-block cursor-not-allowed";
          cancelBtn.className = "px-4 py-2 bg-slate-200 text-slate-400 rounded-lg text-sm font-semibold cursor-not-allowed border border-slate-300 pointer-events-none";
          cancelBtn.disabled = true;
          cancelBtn.onclick = null;
        }
      } else {
        cancelWrapper.classList.add('hidden');
        cancelBtn.onclick = null;
      }
    }

    msgEl.textContent = message;
    dialog.showModal();
    dialog.classList.remove('opacity-0', 'scale-95');
    dialog.classList.add('opacity-100', 'scale-100');

    const closeDialog = function () {
      dialog.classList.remove('opacity-100', 'scale-100');
      dialog.classList.add('opacity-0', 'scale-95');
      setTimeout(() => { if (dialog.open) dialog.close(); }, 200);
    };

    if (closeBtn) closeBtn.onclick = closeDialog;
    if (xBtn) xBtn.onclick = closeDialog;

    if (!('closedBy' in HTMLDialogElement.prototype)) {
      dialog.onclick = function (event) {
        if (event.target !== dialog) return;
        const rect = dialog.getBoundingClientRect();
        const isDialogContent = (
          rect.top <= event.clientY && event.clientY <= rect.top + rect.height &&
          rect.left <= event.clientX && event.clientX <= rect.left + rect.width
        );
        if (!isDialogContent) closeDialog();
      };
    }
  };

  // 美化版自訂 confirm 視窗 (回傳 Promise)
  window.showConfirm = function (message) {
    return new Promise((resolve) => {
      const dialog = document.getElementById('custom-confirm-dialog');
      if (!dialog) { resolve(false); return; }

      const msgEl = document.getElementById('custom-confirm-message');
      const okBtn = document.getElementById('custom-confirm-ok-btn');
      const cancelBtn = document.getElementById('custom-confirm-cancel-btn');
      const xBtn = document.getElementById('custom-confirm-x-btn');

      msgEl.textContent = message;
      dialog.showModal();
      dialog.classList.remove('opacity-0', 'scale-95');
      dialog.classList.add('opacity-100', 'scale-100');

      let isResolved = false;
      const finish = (result) => {
        if (isResolved) return;
        isResolved = true;
        resolve(result);
      };

      const closeWithResult = function (result) {
        if (isResolved) return;
        dialog.classList.remove('opacity-100', 'scale-100');
        dialog.classList.add('opacity-0', 'scale-95');
        setTimeout(() => {
          if (dialog.open) dialog.close();
          finish(result);
        }, 200);
      };

      if (okBtn) okBtn.onclick = () => closeWithResult(true);
      if (cancelBtn) cancelBtn.onclick = () => closeWithResult(false);
      if (xBtn) xBtn.onclick = () => closeWithResult(false);

      // 支援 Esc 鍵或其他原生關閉視窗時順利釋放 Promise
      dialog.onclose = () => finish(false);
      dialog.oncancel = () => finish(false);

      if (!('closedBy' in HTMLDialogElement.prototype)) {
        dialog.onclick = function (event) {
          if (event.target !== dialog) return;
          const rect = dialog.getBoundingClientRect();
          const isDialogContent = (
            rect.top <= event.clientY && event.clientY <= rect.top + rect.height &&
            rect.left <= event.clientX && event.clientX <= rect.left + rect.width
          );
          if (!isDialogContent) closeWithResult(false);
        };
      }
    });
  };

  // 用於選項的自訂彈窗
  window.showSelectModal = function (title, optionsList) {
    return new Promise((resolve) => {
      let dialog = document.getElementById('custom-select-dialog');
      if (!dialog) {
        const html = `
          <dialog id="custom-select-dialog" class="rounded-2xl shadow-2xl border border-slate-200 p-0 max-w-sm w-full bg-white overflow-hidden transition-all duration-200 opacity-0 scale-95" closedby="any">
            <div class="flex flex-col">
              <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center shrink-0">
                <h3 id="custom-select-title" class="text-lg font-bold text-slate-900"></h3>
              </div>
              <div class="p-6 overflow-y-auto flex-1">
                <div id="custom-select-options" class="flex flex-col space-y-3"></div>
              </div>
              <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end items-center gap-3 shrink-0">
                <button id="custom-select-cancel-btn" type="button" class="px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-lg text-sm font-semibold transition border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-300">取消</button>
                <button id="custom-select-ok-btn" type="button" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold transition shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">確定</button>
              </div>
            </div>
          </dialog>
        `;
        document.body.insertAdjacentHTML('beforeend', html);
        dialog = document.getElementById('custom-select-dialog');
      }

      document.getElementById('custom-select-title').textContent = title;
      const optsContainer = document.getElementById('custom-select-options');
      optsContainer.innerHTML = '';
      
      optionsList.forEach((opt, idx) => {
        const checked = idx === 0 ? 'checked' : '';
        optsContainer.insertAdjacentHTML('beforeend', `
          <label class="flex items-center space-x-3 p-3 border rounded-lg cursor-pointer hover:bg-blue-50 transition border-slate-200 hover:border-blue-300">
            <input type="radio" name="batch-status-radio" value="${opt.value}" class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-slate-300" ${checked}>
            <span class="text-slate-800 font-medium">${opt.label}</span>
          </label>
        `);
      });

      const okBtn = document.getElementById('custom-select-ok-btn');
      const cancelBtn = document.getElementById('custom-select-cancel-btn');

      dialog.showModal();
      dialog.classList.remove('opacity-0', 'scale-95');
      dialog.classList.add('opacity-100', 'scale-100');

      let isResolved = false;
      const finish = (result) => {
        if (isResolved) return;
        isResolved = true;
        dialog.classList.remove('opacity-100', 'scale-100');
        dialog.classList.add('opacity-0', 'scale-95');
        setTimeout(() => { if (dialog.open) dialog.close(); resolve(result); }, 200);
      };

      if (okBtn) okBtn.onclick = () => {
        const selected = document.querySelector('input[name="batch-status-radio"]:checked');
        finish(selected ? selected.value : null);
      };
      if (cancelBtn) cancelBtn.onclick = () => finish(null);
      
      dialog.onclose = () => finish(null);
      dialog.oncancel = () => finish(null);
      
      if (!('closedBy' in HTMLDialogElement.prototype)) {
        dialog.onclick = function (event) {
          if (event.target !== dialog) return;
          const rect = dialog.getBoundingClientRect();
          const isDialogContent = (
            rect.top <= event.clientY && event.clientY <= rect.top + rect.height &&
            rect.left <= event.clientX && event.clientX <= rect.left + rect.width
          );
          if (!isDialogContent) finish(null);
        };
      }
    });
  };

  // 共用函式：將 Google Drive 網址轉換為縮圖網址 (防止破圖)
  window.getDriveImageUrl = function(url, size = 100) {
    if (!url || typeof url !== 'string') return url;
    let driveId = null;
    const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) {
      driveId = match[1];
    } else if (url.includes('id=')) {
      const idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
      if (idMatch && idMatch[1]) {
        driveId = idMatch[1];
      }
    }
    return driveId ? `https://drive.google.com/thumbnail?id=${driveId}&sz=w${size}` : url;
  };

  window.openImageModal = function(url) {
    const modal = document.getElementById('image-modal');
    const img = document.getElementById('image-modal-img');
    if (modal && img) {
      img.src = window.getDriveImageUrl(url, 1000);
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      // trigger reflow
      void modal.offsetWidth;
      modal.classList.remove('opacity-0');
      modal.querySelector('div').classList.remove('scale-95');
      modal.querySelector('div').classList.add('scale-100');
    }
  };

  window.closeImageModal = function() {
    const modal = document.getElementById('image-modal');
    if (modal) {
      modal.classList.add('opacity-0');
      modal.querySelector('div').classList.remove('scale-100');
      modal.querySelector('div').classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }, 300);
    }
  };
</script>
