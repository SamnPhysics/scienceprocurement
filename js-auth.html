<script>
  // ==========================================
  // js-auth.html — 認證、登入登出
  // 職責：與 GAS 溝通、LoginManager、checkAuthStatus、handleLogout
  // 載入順序：依賴 js-core.html
  // ==========================================

  const LoginManager = {
    popup: null,
    pollClose: null,

    openPopup: function (loginUrl) {
      if (this.popup && !this.popup.closed) {
        this.popup.focus();
        return;
      }
      this.popup = window.open(loginUrl, 'gas_oauth_popup', 'width=520,height=650,scrollbars=yes,resizable=yes');
      if (!this.popup || this.popup.closed) {
        alert('無法開啟登入視窗，請確認您的瀏覽器未封鎖彈出式視窗（popup），然後再試一次。');
        const btn = document.getElementById('btn-login-logout');
        if (btn) btn.innerText = '登入';
        return;
      }

      document.getElementById('btn-login-logout').innerText = '登入中...';
      window.addEventListener('storage', this.storageHandler);
      window.addEventListener('message', this.msgHandler);

      this.pollClose = setInterval(() => {
        if (this.popup && this.popup.closed) {
          this.cleanup();
          const btn = document.getElementById('btn-login-logout');
          if (btn && btn.innerText === '登入中...') btn.innerText = '登入';
        }
      }, 1000);
    },

    finishLogin: function (token) {
      this.cleanup();
      localStorage.setItem('my_app_token', token);
      localStorage.removeItem('gas_auth_result');
      try { if (this.popup && !this.popup.closed) this.popup.close(); } catch (x) { }
      checkAuthStatus();
    },

    storageHandler: function (e) {
      if (e.key === 'gas_auth_result' && e.newValue) {
        try {
          const d = JSON.parse(e.newValue);
          if (d && d.token) LoginManager.finishLogin(d.token);
        } catch (pe) { }
      }
    },

    msgHandler: function (event) {
      if (event.data && event.data.type === 'gas_oauth_token') {
        LoginManager.finishLogin(event.data.token);
      }
    },

    cleanup: function () {
      if (this.pollClose) clearInterval(this.pollClose);
      window.removeEventListener('storage', this.storageHandler);
      window.removeEventListener('message', this.msgHandler);
    }
  };

  async function checkAuthStatus() {
    const btnAuth = document.getElementById('btn-login-logout');
    if (btnAuth) btnAuth.innerText = '驗證中...';

    try {
      const status = await ApiService.auth.getStatus(getToken());
      if (typeof setupUI === 'function') setupUI(status);
    } catch (err) {
      console.error('Auth Check Error:', err);
      if (typeof setupUI === 'function') setupUI({ loggedIn: false, role: 'guest', loginUrl: window.cachedLoginUrl || '' });
      const emailEl = document.getElementById('email');
      if (emailEl) emailEl.value = '無法載入權限資訊';
    }
  }

  async function handleLogout() {
    const btnAuth = document.getElementById('btn-login-logout');
    if (btnAuth) btnAuth.innerText = '登出中...';
    
    try {
      await ApiService.auth.logout(getToken());
      localStorage.removeItem('my_app_token');
      const status = await ApiService.auth.getStatus(getToken());
      if (typeof setupUI === 'function') setupUI(status);
    } catch (err) {
      alert('登出失敗：' + (err && err.message ? err.message : err));
      try {
        const status = await ApiService.auth.getStatus(getToken());
        if (typeof setupUI === 'function') setupUI(status);
      } catch (innerErr) {
        if (typeof setupUI === 'function') setupUI({ loggedIn: false, role: 'guest', loginUrl: '' });
      }
    }
  }
</script>
