<script>
  // ==========================================
  // Module: js-auth.html
  // Responsibility: 處理使用者驗證流程，包含登入彈窗管理 (LoginManager)、權限狀態檢查 (checkAuthStatus) 與登出邏輯 (handleLogout)。
  // Dependencies: js-core.html (提供 ApiService, getToken), js-switch.html (呼叫 setupUI)
  // Exports: LoginManager, checkAuthStatus, handleLogout
  // ==========================================

  /**
   * @global
   * @description 登入彈窗管理器 (LoginManager)
   * 負責開啟 GAS 的 OAuth 登入彈窗，並透過 postMessage 或 localStorage 監聽登入完成的狀態。
   */
  const LoginManager = {
    popup: null,
    pollClose: null,

    /**
     * 開啟登入彈窗
     * @param {string} loginUrl - OAuth 登入網址
     */
    openPopup: function(loginUrl) {
      if (this.popup && !this.popup.closed) {
        this.popup.focus();
        return;
      }
      const w = 520;
      const h = 650;
      const left = (screen.width - w) / 2;
      const top = (screen.height - h) / 2;
      this.popup = window.open(loginUrl, 'gas_oauth_popup', `width=${w},height=${h},top=${top},left=${left},scrollbars=yes,resizable=yes`);
      if (!this.popup || this.popup.closed) {
        alert('無法開啟登入視窗，請確認您的瀏覽器未封鎖彈出式視窗（popup），然後再試一次。');
        const btn = document.getElementById('btn-login-logout');
        if (btn) btn.innerText = '登入';
        return;
      }

      document.getElementById('btn-login-logout').innerText = '登入中...';
      window.addEventListener('storage', this.storageHandler);
      window.addEventListener('message', this.msgHandler);

      this.pollClose = setInterval(() => {
        if (this.popup && this.popup.closed) {
          this.cleanup();
          const btn = document.getElementById('btn-login-logout');
          if (btn && btn.innerText === '登入中...') btn.innerText = '登入';
        }
      }, 1000);
    },

    /**
     * 接收到 Token 後，結束登入流程並將 Token 寫入 localStorage
     * @param {string} token - 後端配發的驗證 Token
     */
    finishLogin: function (token, initialStatus) {
      this.cleanup();
      localStorage.setItem('my_app_token', token);
      localStorage.removeItem('gas_auth_result');
      try { if (this.popup && !this.popup.closed) this.popup.close(); } catch (x) { }
      
      if (initialStatus) {
        localStorage.setItem('cached_auth_status', JSON.stringify(initialStatus));
        if (typeof setupUI === 'function') setupUI(initialStatus);
      } else {
        checkAuthStatus();
      }
    },

    /**
     * 監聽同網域下其他視窗 (包含彈窗) 的 localStorage 變更事件
     * 這是取得登入成功通知的方法之一 (跨視窗通訊)
     */
    storageHandler: function (e) {
      if (e.key === 'gas_auth_result' && e.newValue) {
        try {
          const d = JSON.parse(e.newValue);
          if (d && d.token) LoginManager.finishLogin(d.token, d.authStatus);
        } catch (pe) { }
      }
    },

    /**
     * 監聽彈窗傳來的 postMessage 事件
     * 這是取得登入成功通知的另一種方法 (跨網域通訊)
     */
    msgHandler: function (event) {
      if (event.data && event.data.type === 'gas_oauth_token') {
        LoginManager.finishLogin(event.data.token, event.data.authStatus);
      }
    },

    /**
     * 清除登入過程中掛載的計時器與事件監聽器
     */
    cleanup: function () {
      if (this.pollClose) clearInterval(this.pollClose);
      window.removeEventListener('storage', this.storageHandler);
      window.removeEventListener('message', this.msgHandler);
    }
  };

  /**
   * 檢查當前使用者的權限狀態 (Auth Status)
   * 會呼叫後端 API 驗證 Token 是否有效，並將結果傳遞給 setupUI 進行畫面渲染
   * @returns {Promise<void>}
   */
  async function checkAuthStatus() {
    const btnAuth = document.getElementById('btn-login-logout');
    if (btnAuth) btnAuth.innerText = '驗證中...';

    try {
      const status = await ApiService.auth.getStatus(getToken());
      if (typeof setupUI === 'function') setupUI(status);
    } catch (err) {
      console.error('Auth Check Error:', err);
      if (typeof setupUI === 'function') setupUI({ loggedIn: false, role: 'guest', loginUrl: window.cachedLoginUrl || '' });
      const emailEl = document.getElementById('email');
      if (emailEl) emailEl.value = '無法載入權限資訊';
    }
  }

  /**
   * 處理使用者登出流程
   * 會清除 localStorage 的 Token，呼叫後端登出 API，並將畫面重置為訪客狀態
   * @returns {Promise<void>}
   */
  async function handleLogout() {
    const btnAuth = document.getElementById('btn-login-logout');
    if (btnAuth) btnAuth.innerText = '登出中...';
    
    try {
      await ApiService.auth.logout(getToken());
      
      const isPublic = localStorage.getItem('isPublicComputer') === 'true';
      
      if (isPublic) {
        localStorage.clear();
        // 重置畫面為訪客狀態
        if (typeof setupUI === 'function') {
          setupUI({ loggedIn: false, role: 'guest', loginUrl: window.cachedLoginUrl || '' });
        }
        
        // 彈出手動引導提示
        const userAgreed = await window.showConfirm('您已登出系統！\n因為是公用電腦，為確保帳號安全，是否立即登出 Google 帳號？');
        if (userAgreed) {
          window.open('https://accounts.google.com/Logout', '_blank');
        }
        return;
      }

      localStorage.removeItem('my_app_token');
      const status = await ApiService.auth.getStatus(getToken());
      if (typeof setupUI === 'function') setupUI(status);
    } catch (err) {
      alert('登出失敗：' + (err && err.message ? err.message : err));
      try {
        const status = await ApiService.auth.getStatus(getToken());
        if (typeof setupUI === 'function') setupUI(status);
      } catch (innerErr) {
        if (typeof setupUI === 'function') setupUI({ loggedIn: false, role: 'guest', loginUrl: '' });
      }
    }
  }
</script>
