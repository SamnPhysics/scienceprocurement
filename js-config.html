  // ----- 表格欄位小元件 (TD Builders) -----
  function buildTd(content, classNames = "p-3") {
    return `<td class="${classNames}">${content}</td>`;
  }
  function buildCheckboxTd(rowNumber) {
    return buildTd(`<input type="checkbox" class="user-row-checkbox rounded border-slate-300 text-blue-600 focus:ring-blue-500" value="${rowNumber}">`, "p-3 text-center");
  }
  function buildPhotoTd(photoUrl) {
    if (photoUrl && photoUrl !== '無照片') {
      return buildTd(`<img src="${getDriveImageUrl(photoUrl, 100)}" alt="圖片" class="w-10 h-10 object-cover mx-auto rounded cursor-pointer border border-slate-200 hover:opacity-80 transition" referrerpolicy="no-referrer" onclick="openImageModal('${photoUrl}')">`, "p-3 text-center");
    }
    return buildTd('<span class="text-slate-400 text-xs">無</span>', "p-3 text-center");
  }
  function buildStatusSelectTd(system, currentStatus, rowNumber) {
    const options = STATUS_OPTIONS[system] || STATUS_OPTIONS.chem;
    const optionsHtml = options.map(opt =>
      `<option value="${opt.value}" ${currentStatus === opt.value ? 'selected' : ''}>${opt.label}</option>`
    ).join('');
    return buildTd(`<div class="flex items-center justify-center"><select id="status-select-${rowNumber}" class="rounded border p-1 text-xs bg-white focus:outline-none">${optionsHtml}</select></div>`, "p-3 text-center");
  }
  function buildPriceInputTd(rowNumber, value, placeholder) {
    return buildTd(`<input type="text" id="price-input-${rowNumber}" value="${value || ''}" placeholder="${placeholder}" class="w-20 border rounded px-1.5 py-1 text-xs text-center focus:outline-none focus:ring-1 focus:ring-blue-500">`, "p-3 text-center");
  }
  function buildActionBtnTd(rowNumber) {
    return buildTd(`<button onclick="handleUpdateClick(${rowNumber}, this)" class="px-2.5 py-1 bg-blue-500 text-white text-xs rounded hover:bg-blue-600 transition shadow-sm font-medium">更新</button>`, "p-3 text-center");
  }

  // 狀態色彩標籤
  function getStatusBadge(status) {
    if (status === '已請購' || status === '已購入' || status === '已歸還') {
      return `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200">${status}</span>`;
    } else if (status === '不通過') {
      return `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-rose-100 text-rose-800 border border-rose-200">${status}</span>`;
    } else {
      return `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200">${status || '未請購'}</span>`;
    }
  }

  // 日期格式化補助：僅保留 YYYY-MM-DD
  function formatDateOnly(str) {
    if (!str) return '';
    if (typeof str !== 'string') str = String(str);
    var trimmed = str.trim();
    if (trimmed.includes(' ')) return trimmed.split(' ')[0];
    if (trimmed.includes('T')) return trimmed.split('T')[0];
    return trimmed;
  }

  // 共用日期過濾輔助函數
  function filterByDate(item, year, month) {
    if (!item.timestamp) return false;
    const parts = String(item.timestamp).split('-');
    const matchYear = !year || parts[0] === year;
    const matchMonth = !month || parts[1] === month;
    return matchYear && matchMonth;
  }

  // 動態年份篩選下拉選單載入
  function populateYearFilters(data, selectId) {
    const select = document.getElementById(selectId);
    if (!select) return;

    const currentValue = select.value;
    select.innerHTML = '<option value="">全部年份</option>';

    const years = new Set();
    data.forEach(function (item) {
      if (item.timestamp) {
        const y = item.timestamp.split('-')[0];
        if (y && y.length === 4) years.add(y);
      }
    });

    const sortedYears = Array.from(years).sort(function (a, b) { return b - a; });
    sortedYears.forEach(function (y) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y + ' 年';
      if (y === currentValue) opt.selected = true;
      select.appendChild(opt);
    });
  }
