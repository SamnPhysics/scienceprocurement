  /**
   * @global
   * @description UI 元件產生器 (UIBuilder)
   * 提供生成表格儲存格 <td> 與特定互動元件 (如狀態下拉選單、金額輸入框、狀態標籤) 的封裝方法。
   */
  const UIBuilder = {
    /**
     * 建立基本的 <td> 元素
     * @param {string} content - 儲存格內的 HTML 內容
     * @param {string} classNames - CSS 類別，預設為 "p-3"
     * @returns {string} 渲染後的 <td> HTML 字串
     */
    buildTd: function(content, classNames = "p-3") {
      return `<td class="${classNames}">${content}</td>`;
    },

    /**
     * 建立含有核取方塊的 <td> 元素 (用於批次選取)
     * @param {number|string} rowNumber - 該資料列的唯一識別碼
     * @returns {string} 渲染後的 <td> HTML 字串
     */
    buildCheckboxTd: function(rowNumber) {
      return this.buildTd(`<input type="checkbox" class="user-row-checkbox rounded border-slate-300 text-blue-600 focus:ring-blue-500" value="${rowNumber}">`, "p-3 text-center");
    },

    /**
     * 建立含有狀態下拉選單的 <td> 元素 (供管理員更新狀態)
     * @param {string} system - 當前系統代號 ('equipBorrow', 'equip', 'chem')
     * @param {string} currentStatus - 當前該筆資料的狀態
     * @param {number|string} rowNumber - 該資料列的唯一識別碼
     * @returns {string} 渲染後的 <td> HTML 字串
     */
    buildStatusSelectTd: function(system, currentStatus, rowNumber) {
      const options = AppConfig.STATUS_OPTIONS[system] || AppConfig.STATUS_OPTIONS.chem;
      const optionsHtml = options.map(opt =>
        `<option value="${opt.value}" ${currentStatus === opt.value ? 'selected' : ''}>${opt.label}</option>`
      ).join('');
      return this.buildTd(`<div class="flex items-center justify-center"><select id="status-select-${rowNumber}" class="rounded border p-1 text-xs bg-white focus:outline-none">${optionsHtml}</select></div>`, "p-3 text-center");
    },
    /**
     * 建立含有金額/文字輸入框的 <td> 元素 (供管理員更新備註或單價)
     * @param {number|string} rowNumber - 該資料列的唯一識別碼
     * @param {string|number} value - 當前輸入框的值
     * @param {string} placeholder - 提示文字 (如 '元', '備註')
     * @returns {string} 渲染後的 <td> HTML 字串
     */

      return this.buildTd(`<input type="text" id="price-input-${rowNumber}" value="${value || ''}" placeholder="${placeholder}" class="w-20 border rounded px-1.5 py-1 text-xs text-center focus:outline-none focus:ring-1 focus:ring-blue-500">`, "p-3 text-center");
    },
    /**
     * 建立觸發更新動作的按鈕 <td> 元素
     * (結合 data-action 供外層 Event Delegation 使用)
     * @param {number|string} rowNumber - 該資料列的唯一識別碼
     * @returns {string} 渲染後的 <td> HTML 字串
     */

      return this.buildTd(`<button data-action="update" data-row="${rowNumber}" class="btn-update-row px-2.5 py-1 bg-blue-500 text-white text-xs rounded hover:bg-blue-600 transition shadow-sm font-medium">更新</button>`, "p-3 text-center");
    },
    /**
     * 根據狀態文字回傳具有對應顏色樣式的 Badge HTML
     * @param {string} status - 狀態字串 (如 '已請購', '不通過')
     * @returns {string} 帶有樣式的 HTML span 元素
     */

      if (status === '已請購' || status === '已購入' || status === '已歸還') {
        return `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200">${status}</span>`;

        return `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-rose-100 text-rose-800 border border-rose-200">${status}</span>`;
      } else {
        return `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200">${status || '未請購'}</span>`;
      }
    }

  /**
   * @global
   * @description 資料處理輔助工具 (DataUtils)
   * 提供日期格式化、日期篩選與選單資料萃取等純邏輯函式。
   */
  const DataUtils = {
    /**
     * 格式化日期字串，僅保留 YYYY-MM-DD 部分
     * @param {string|Date} str - 原始日期時間字串或物件
     * @returns {string} 格式化後的日期字串
     */
    formatDateOnly: function(str) {
      if (!str) return '';
      if (typeof str !== 'string') str = String(str);
      var trimmed = str.trim();
      if (trimmed.includes(' ')) return trimmed.split(' ')[0];
      if (trimmed.includes('T')) return trimmed.split('T')[0];
      return trimmed;
    },
    /**
     * 判斷指定資料項目是否符合選擇的年份與月份
     * @param {Object} item - 包含 timestamp 屬性的資料物件
     * @param {string} year - 篩選的年份 (為空字串代表不限)
     * @param {string} month - 篩選的月份 (為空字串代表不限)
     * @returns {boolean} 是否符合條件
     */
    filterByDate: function(item, year, month) {
      if (!item.timestamp) return false;
      const parts = String(item.timestamp).split('-');
      const matchYear = !year || parts[0] === year;
      const matchMonth = !month || parts[1] === month;
      return matchYear && matchMonth;
    },
    /**
     * 掃描所有資料的 timestamp 欄位，萃取出所有出現過的年份，並填入下拉選單中
     * @param {Array<Object>} data - 資料陣列
     * @param {string} selectId - 目標年份下拉選單的 HTML ID
     */
    populateYearFilters: function(data, selectId) {
      const select = document.getElementById(selectId);
      if (!select) return;

      const currentValue = select.value;
      select.innerHTML = '<option value="">全部年份</option>';

      const years = new Set();
      data.forEach(function (item) {
        if (item.timestamp) {
          const y = item.timestamp.split('-')[0];
          if (y && y.length === 4) years.add(y);
        }
      });

      const sortedYears = Array.from(years).sort(function (a, b) { return b - a; });
      sortedYears.forEach(function (y) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + ' 年';
        if (y === currentValue) opt.selected = true;
        select.appendChild(opt);
      });
    }
  };
