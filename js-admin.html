<script>
  // ==========================================
  // js-admin.html — 管理功能、資料清單、系統設定
  // 職責：renderDatalist、批次更新(優化E)、匯出、系統設定、Logo上傳
  // 共用工具：getStatusBadge、formatDateOnly、filterByDate、populateYearFilters
  // 載入順序：依賴 js-core.html、js-ui-widgets.html
  // ==========================================

  // 已抽離至 js-config.html

  // 重新整理目前的資料清單
  function refreshDatalist() {
    if (window.SystemCache) {
      const rolePrefix = AppState.currentActionView === 'user-list' ? 'user' : 'admin';
      window.SystemCache.invalidate(`${rolePrefix}_${AppState.currentSystemTab}`);
    }
    renderDatalist(AppState.currentActionView, AppState.currentSystemTab);
  }

  // 動態渲染共用清單 (Entry Point)
  function renderDatalist(role, system) {
    const titleEl = document.getElementById('datalist-title');
    const theadEl = document.getElementById('datalist-thead');
    const searchInput = document.getElementById('datalist-filter-keyword');
    const btnCancel = document.getElementById('datalist-btn-cancel');
    const btnExport = document.getElementById('datalist-btn-export');
    const tbody = document.getElementById('datalist-tbody');

    if (!datalistManager && typeof window.ensureDatalistManager === 'function') {
      window.ensureDatalistManager();
    }
    if (!datalistManager) return;

    tbody.innerHTML = '<tr><td colspan="15" class="p-4 text-center text-slate-400">載入資料中...</td></tr>';

    const sysNameMap = { 'equip': '教學及實驗設備', 'lab': '自然科實驗室借用', 'equipBorrow': '教學實驗設備借用', 'chem': '藥品/物品' };
    const sysName = sysNameMap[system] || sysNameMap['chem'];

    if (role === 'user-list') {
      renderUserDatalist(system, titleEl, theadEl, searchInput, btnCancel, btnExport, tbody, sysName);
    } else if (role === 'admin') {
      renderAdminDatalist(system, titleEl, theadEl, searchInput, btnCancel, btnExport, tbody, sysName);
    }
  }

  function _setupDatalistHeaderAndRow(system, role, theadEl) {
    const columns = TABLE_COLUMNS_CONFIG[system] && TABLE_COLUMNS_CONFIG[system][role] ? TABLE_COLUMNS_CONFIG[system][role] : [];

    if (theadEl) {
      theadEl.innerHTML = '<tr>' + columns.map(c => `<th class="${c.thClass || 'p-3'}">${c.header}</th>`).join('') + '</tr>';
    }

    datalistManager.config.colSpan = columns.length;

    datalistManager.config.renderRow = function (item) {
      const titleText = system === 'equip' || system === 'equipBorrow' ? (system === 'equipBorrow' ? '借用說明：' : '需求及用途說明：') : '備註：';
      const remark = (item.purpose || item.remark || '無').replace(/"/g, '&quot;');
      const photo = item.photoUrl || '無照片';

      const tds = columns.map(c => c.render(item, system)).join('');

      return `<tr class="hover:bg-slate-50 border-b border-slate-100 cursor-pointer transition tooltip-trigger" data-title="${titleText}" data-remark="${remark}" data-photo="${photo}" onclick="showRowDetailModal(event, ${item.rowNumber}, '${system}')">${tds}</tr>`;
    };
  }

  function renderUserDatalist(system, titleEl, theadEl, searchInput, btnCancel, btnExport, tbody, sysName) {
    titleEl.textContent = `${sysName}申請清單`;
    if (searchInput) searchInput.classList.add('hidden');
    if (btnCancel) btnCancel.classList.toggle('hidden', system === 'equipBorrow');
    if (btnExport) btnExport.classList.add('hidden');

    const btnBatchUpdate = document.getElementById('datalist-btn-batch-update');
    if (btnBatchUpdate) { btnBatchUpdate.classList.add('hidden'); btnBatchUpdate.classList.remove('flex'); }

    datalistManager.config.calculateSum = (system !== 'equipBorrow');
    datalistManager.config.sumField = (system === 'equip') ? 'price' : 'totalPrice';
    datalistManager.config.sumTitle = (system === 'equip') ? '本頁自估單價加總：' : '本頁採購總價加總：';
    datalistManager.config.applicantFilterId = null;

    _setupDatalistHeaderAndRow(system, 'user-list', theadEl);

    datalistManager.config.onRender = () => { const cb = document.getElementById("user-select-all"); if (cb) cb.checked = false; };

    SystemCache.fetchData(`user_${system}`, () => window.callGas('getUserData', getToken(), system), (data, err) => {
      if (AppState.currentActionView !== 'user-list' || AppState.currentSystemTab !== system) return;
      if (err) { tbody.innerHTML = `<tr><td colspan="${datalistManager.config.colSpan}" class="p-4 text-center text-red-500">載入資料失敗：${err.message || err}</td></tr>`; return; }
      datalistManager.setData(data);
    });
  }

  function renderAdminDatalist(system, titleEl, theadEl, searchInput, btnCancel, btnExport, tbody, sysName) {
    titleEl.textContent = `${sysName}審核面板`;
    if (searchInput) searchInput.classList.remove('hidden');
    if (btnCancel) btnCancel.classList.add('hidden');
    if (btnExport) btnExport.classList.remove('hidden');

    const btnBatchUpdate = document.getElementById('datalist-btn-batch-update');
    if (btnBatchUpdate) {
      if (['chem', 'equip', 'equipBorrow'].includes(system)) {
        btnBatchUpdate.classList.remove('hidden'); btnBatchUpdate.classList.add('flex');
      } else {
        btnBatchUpdate.classList.add('hidden'); btnBatchUpdate.classList.remove('flex');
      }
    }

    datalistManager.config.calculateSum = false;
    datalistManager.config.applicantFilterId = 'datalist-filter-keyword';

    _setupDatalistHeaderAndRow(system, 'admin', theadEl);

    datalistManager.config.onRender = () => { const cb = document.getElementById("admin-select-all"); if (cb) cb.checked = false; };

    SystemCache.fetchData(`admin_${system}`, () => window.callGas('getAdminData', getToken(), system), (data, err) => {
      if (AppState.currentActionView !== 'admin' || AppState.currentSystemTab !== system) return;
      if (err) { tbody.innerHTML = `<tr><td colspan="${datalistManager.config.colSpan}" class="p-4 text-center text-red-500">載入資料失敗：${err.message || err}</td></tr>`; return; }
      datalistManager.setData(data);
    });
  }

  // 更新狀態與採購總價
  async function updateStatus(rowNumber, newStatus, totalPrice, btnEl) {
    if (btnEl) { btnEl.disabled = true; btnEl.innerText = '更新中...'; btnEl.classList.add('opacity-70', 'cursor-not-allowed'); }

    try {
      const res = await ApiService.admin.updateStatus(rowNumber, newStatus, totalPrice, getToken(), AppState.currentSystemTab);
      
      if (btnEl) { btnEl.disabled = false; btnEl.innerText = '更新'; btnEl.classList.remove('opacity-70', 'cursor-not-allowed'); }
      if (res.success) {
        if (datalistManager && datalistManager.rawData) {
          const item = datalistManager.rawData.find(i => i.rowNumber === rowNumber);
          if (item) { item.status = newStatus; item.totalPrice = totalPrice; }
          datalistManager.render();
        }
        alert('狀態與金額更新成功！');
      } else {
        alert('狀態與金額更新失敗：' + (res.message || '未知錯誤'));
        refreshDatalist();
      }
    } catch (err) {
      if (btnEl) { btnEl.disabled = false; btnEl.innerText = '更新'; btnEl.classList.remove('opacity-70', 'cursor-not-allowed'); }
      alert('連線失敗，更新未成功：' + (err.message || err));
      refreshDatalist();
    }
  }

  function handleUpdateClick(rowNumber, btnEl) {
    const statusEl = document.getElementById(`status-select-${rowNumber}`);
    const priceEl = document.getElementById(`price-input-${rowNumber}`);
    if (statusEl && priceEl) updateStatus(rowNumber, statusEl.value, priceEl.value, btnEl);
  }

  function toggleSelectAllUsers(isChecked) {
    document.querySelectorAll('.user-row-checkbox').forEach(cb => cb.checked = isChecked);
  }

  async function cancelSelectedRequests() {
    const checkboxes = document.querySelectorAll('.user-row-checkbox:checked');
    if (checkboxes.length === 0) { alert('請先勾選要取消的請購項目！'); return; }

    const rowNumbers = Array.from(checkboxes).map(cb => parseInt(cb.value));
    const isConfirmed = await showConfirm(`您確定要取消這 ${rowNumbers.length} 筆請購項目嗎？此動作將會從資料庫中永久刪除！`);
    if (!isConfirmed) return;

    const cancelBtn = document.querySelector('button[onclick="cancelSelectedRequests()"]');
    if (cancelBtn) { cancelBtn.disabled = true; cancelBtn.textContent = '處理中...'; }

    try {
      const res = await ApiService.admin.deleteRequests(rowNumbers, getToken(), AppState.currentSystemTab);
      
      if (cancelBtn) { cancelBtn.disabled = false; cancelBtn.textContent = '取消申請'; }
      if (res.success) {
        if (window.SystemCache) {
          window.SystemCache.invalidate('user_' + AppState.currentSystemTab);
          window.SystemCache.invalidate('admin_' + AppState.currentSystemTab);
        }
        alert('成功取消請購申請！');
        refreshDatalist();
      } else {
        alert('取消失敗：' + (res.message || '未知錯誤'));
      }
    } catch (err) {
      if (cancelBtn) { cancelBtn.disabled = false; cancelBtn.textContent = '取消申請'; }
      alert('連線失敗，取消未成功：' + (err.message || err));
    }
  }

  // 優化E：batchUpdateAdminRequests 替換原生 prompt() 為 showConfirm
  async function batchUpdateAdminRequests() {
    const checkboxes = document.querySelectorAll('.user-row-checkbox:checked');
    if (checkboxes.length === 0) { alert('請先勾選要批次更新的項目！'); return; }

    const options = STATUS_OPTIONS[AppState.currentSystemTab] || STATUS_OPTIONS.chem;
    const newStatus = await showSelectModal('請選擇要批次變更的狀態：', options);
    if (!newStatus) return;

    const updates = Array.from(checkboxes).map(cb => {
      const rowNum = parseInt(cb.value);
      const priceEl = document.getElementById(`price-input-${rowNum}`);
      return { rowNumber: rowNum, newStatus: newStatus, totalPrice: priceEl ? priceEl.value : '' };
    });

    const isConfirmed = await showConfirm(`您確定要批次將這 ${updates.length} 筆項目的狀態變更為「${newStatus}」嗎？`);
    if (!isConfirmed) return;

    const btn = document.getElementById('datalist-btn-batch-update');
    if (btn) { btn.disabled = true; btn.innerHTML = `<svg class="animate-spin w-4 h-4 mr-1 inline" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>處理中...`; }

    try {
      const res = await ApiService.admin.batchUpdateStatus(updates, getToken(), AppState.currentSystemTab);
      
      if (btn) { btn.disabled = false; btn.innerHTML = `<svg class="w-4 h-4 mr-1 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>批次更新`; }
      if (res.success) {
        alert('批次更新成功！');
      } else {
        alert('更新失敗：' + (res.message || '未知錯誤'));
      }
      refreshDatalist();
    } catch (err) {
      if (btn) { btn.disabled = false; btn.innerHTML = `<svg class="w-4 h-4 mr-1 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>批次更新`; }
      alert('連線失敗，更新未成功：' + (err.message || err));
      refreshDatalist();
    }
  }

  // 顯示資料列詳細資訊彈窗
  window.showRowDetailModal = function(event, rowNumber, system) {
    if (event && event.target.closest('input, select, button, label')) return;
    if (!datalistManager || !datalistManager.rawData) return;
    
    const item = datalistManager.rawData.find(i => i.rowNumber === rowNumber);
    if (!item) return;

    let dialog = document.getElementById('row-detail-modal');
    if (!dialog) {
      const dialogHtml = `
        <dialog id="row-detail-modal" class="rounded-2xl shadow-2xl border border-slate-200 p-0 max-w-lg w-full bg-white overflow-hidden transition-all duration-200 opacity-0 scale-95" closedby="any"></dialog>
      `;
      document.body.insertAdjacentHTML('beforeend', dialogHtml);
      dialog = document.getElementById('row-detail-modal');
    }

    let title = '';
    let contentHtml = '';
    
    // 使用 getDriveImageUrl 取得 Thumbnail 網址 (sz=w800)，移除 onclick 放大功能，並加上 max-height
    const photoUrl = item.photoUrl && item.photoUrl !== '無照片' ? window.getDriveImageUrl(item.photoUrl, 800) : '';
    const photoHtml = photoUrl ? `<img src="${photoUrl}" class="w-full h-auto rounded border border-slate-100 mt-3 object-contain max-h-[40vh]" referrerpolicy="no-referrer">` : `<div class="text-sm text-slate-400 mt-3 italic bg-slate-50 p-4 rounded text-center border border-slate-100">無上傳照片</div>`;

    if (system === 'chem') {
      title = '藥品/物品 審核明細';
      contentHtml = `
        <div class="space-y-3 text-slate-700">
          <p><strong>中文名稱：</strong>${item.chineseName || '無'}</p>
          <p><strong>所需數量：</strong>${item.quantity || '無'}</p>
          <p><strong>備註：</strong><br><span class="whitespace-pre-wrap">${item.remark || item.purpose || '無'}</span></p>
          <div><strong>物品/藥品照片：</strong>${photoHtml}</div>
        </div>
      `;
    } else if (system === 'equipBorrow') {
      title = '教學實驗設備借用 明細';
      contentHtml = `
        <div class="space-y-3 text-slate-700">
          <p><strong>物品：</strong>${item.chineseName || '無'}</p>
          <p><strong>數量：</strong>${item.quantity || '無'}</p>
          <p><strong>借用說明：</strong><br><span class="whitespace-pre-wrap">${item.purpose || item.remark || '無'}</span></p>
          <div><strong>照片：</strong>${photoHtml}</div>
        </div>
      `;
    } else if (system === 'equip') {
      title = '教學及實驗設備申請 明細';
      contentHtml = `
        <div class="space-y-3 text-slate-700">
          <p><strong>設備/軟體名稱：</strong>${item.chineseName || '無'}</p>
          <p><strong>數量：</strong>${item.quantity || '無'}</p>
          <p><strong>需求及用途說明：</strong><br><span class="whitespace-pre-wrap">${item.purpose || item.remark || '無'}</span></p>
          <div><strong>照片：</strong>${photoHtml}</div>
        </div>
      `;
    }

    dialog.innerHTML = `
      <div class="flex flex-col max-h-[90vh]">
        <div class="px-6 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center shrink-0">
          <h3 class="text-lg font-bold text-slate-900">${title}</h3>
          <button id="row-detail-x-btn" class="text-slate-400 hover:text-slate-600 transition p-1 rounded-full hover:bg-slate-200 focus:outline-none">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="p-6 overflow-y-auto flex-1">
          ${contentHtml}
        </div>
        <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3 shrink-0">
          <button id="row-detail-close-btn" class="px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-lg text-sm font-semibold transition border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-300">關閉</button>
        </div>
      </div>
    `;

    const closeDialog = function() {
      dialog.classList.remove('opacity-100', 'scale-100');
      dialog.classList.add('opacity-0', 'scale-95');
      setTimeout(() => { if (dialog.open) dialog.close(); }, 200);
    };

    dialog.querySelector('#row-detail-x-btn').onclick = closeDialog;
    dialog.querySelector('#row-detail-close-btn').onclick = closeDialog;

    dialog.showModal();
    void dialog.offsetWidth; 
    dialog.classList.remove('opacity-0', 'scale-95');
    dialog.classList.add('opacity-100', 'scale-100');

    if (!('closedBy' in HTMLDialogElement.prototype)) {
      dialog.onclick = function(event) {
        if (event.target !== dialog) return;
        const rect = dialog.getBoundingClientRect();
        const isDialogContent = (
          rect.top <= event.clientY && event.clientY <= rect.top + rect.height &&
          rect.left <= event.clientX && event.clientX <= rect.left + rect.width
        );
        if (!isDialogContent) closeDialog();
      };
    }
  };

  // 匯出管理者資料為 Excel
  function exportAdminDataToExcel() {
    if (typeof XLSX === 'undefined') { alert('Excel 匯出模組載入失敗，請檢查網路連線。'); return; }
    const filteredAdminData = datalistManager ? datalistManager.filteredData : null;
    if (!filteredAdminData || filteredAdminData.length === 0) { alert('沒有符合篩選條件的資料可以匯出。'); return; }

    const exportConfig = SYSTEM_EXPORT_CONFIGS[AppState.currentSystemTab] || SYSTEM_EXPORT_CONFIGS.chem;
    const exportData = filteredAdminData.map(item => {
      const row = {};
      exportConfig.columns.forEach(col => {
        row[col.label] = col.value(item);
      });
      return row;
    });

    const ws = XLSX.utils.json_to_sheet(exportData);
    const wscols = exportConfig.columns.map(col => ({ wch: Math.max(col.label.length * 2, 12) }));
    ws['!cols'] = wscols;
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, exportConfig.sheetName);

    const elYear = document.getElementById('datalist-filter-year');
    const elMonth = document.getElementById('datalist-filter-month');
    const elApp = document.getElementById('datalist-filter-keyword');
    const yearStr = elYear && elYear.value ? elYear.value + '年' : '全部年份';
    const monthStr = elMonth && elMonth.value ? elMonth.value + '月' : '全部月份';
    const applicantStr = elApp && elApp.value.trim() ? '_' + elApp.value.trim() : '';
    XLSX.writeFile(wb, `${exportConfig.fileName}_${yearStr}_${monthStr}${applicantStr}.xlsx`);
  }
</script>
