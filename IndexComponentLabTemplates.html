<!-- ==========================================
     IndexComponentLabTemplates.html
     實驗室預約系統 - 前端 DOM 動態渲染共用 HTML 樣板庫
     以 <template> 保存 HTML 結構，透過 js-core 的 renderTemplate() 進行變數渲染
     ========================================== -->

<!-- ==================== Part 1: 主畫面視圖渲染樣板 (js-lab-render 使用) ==================== -->

<!-- 1. 空間左側資訊欄簡歷卡片樣板 -->
<template id="lab-room-info-card-template">
  <img src="{{image}}" alt="{{name}}" class="w-12 h-12 rounded-lg object-cover bg-gray-100 shadow-inner shrink-0">
  <div class="flex flex-col justify-center overflow-hidden">
    <div
      class="font-bold text-gray-800 text-sm truncate group-hover/info:text-indigo-600 transition">
      {{name}}</div>
    <div class="flex items-center gap-2 text-xs text-gray-500 mt-1">
      <span class="shrink-0"><i class="fa-solid fa-user-group text-gray-400 mr-0.5"></i>{{capacity}}人</span>
      {{floorBadge}}
    </div>
  </div>
  <!-- 懸停時於資訊卡內部右下角「直接重疊」顯示 (Tooltip 浮層)，放置於最外層避開 overflow-hidden 裁切與相鄰元素遮蔽 -->
  <div class="absolute right-2 bottom-2 z-50 pointer-events-none
              opacity-0 group-hover/info:opacity-100
              transition-all duration-150 transform scale-95 group-hover/info:scale-100">
    <div
      class="bg-indigo-600 text-white text-[11px] font-semibold tracking-wide whitespace-nowrap px-2.5 py-1 rounded-md shadow-md flex items-center gap-1.5 border border-indigo-400/30">
      <i class="fa-regular fa-calendar-days text-[11px]"></i> 看本週課表
    </div>
  </div>
</template>

<!-- 2. 空間左側資訊欄樓層標籤樣板 -->
<template id="lab-room-floor-badge-template"><span class="shrink-0"><i
      class="fa-solid fa-layer-group text-gray-400 mr-0.5"></i>{{floor}}</span></template>

<!-- 3. 查無空間資料時的空狀態提示樣板 (Empty State) -->
<template id="lab-empty-state-template">
  <div class="p-12 text-center text-gray-400 font-medium flex flex-col items-center justify-center gap-2"><i
      class="fa-solid fa-magnifying-glass text-3xl text-gray-300"></i><span>查無符合篩選條件的實驗室空間</span></div>
</template>

<!-- 4. 時間軸方塊懸停「+ 預約」按鈕提示樣板 -->
<template id="lab-timeline-cell-hover-template">
  <div
    class="opacity-0 group-hover/cell:opacity-100 transition duration-150 bg-indigo-600 text-white text-[11px] font-semibold px-2.5 py-1 rounded-md shadow-md pointer-events-none flex items-center gap-1.5 scale-95 group-hover/cell:scale-100 z-10">
    預約 {{startTime}}</div>
</template>

<!-- 5. 時間軸上的課程預約方塊樣板 -->
<template id="lab-timeline-booking-block-template">
  <div class="text-xs font-bold truncate tracking-wide flex items-center justify-between">
    <span>{{title}}</span>
    <span class="text-[10px] font-normal opacity-90 ml-1 bg-black/10 px-1 rounded">{{start}}-{{end}}</span>
  </div>
  <div class="text-[11px] opacity-90 truncate mt-0.5 flex items-center gap-1">
    <i class="fa-regular fa-user text-[10px]"></i> {{user}}
  </div>
</template>

<!-- 6. 週/月檢視 - 有預約紀錄時的數量統計方塊樣板 -->
<template id="lab-week-cell-booked-template">
  <div class="w-full h-full flex flex-col items-center justify-center p-2 rounded-md hover:bg-gray-100 transition">
    <div
      class="w-6 h-6 rounded-full bg-indigo-500 {{opacityClass}} text-white flex items-center justify-center text-xs font-bold mb-1 shadow-sm">
      {{count}}</div>
    <span class="text-[10px] text-gray-500">筆預約</span>
  </div>
</template>

<!-- 7. 週/月檢視 - 無預約紀錄時的閒置預約加號樣板 -->
<template id="lab-week-cell-empty-template">
  <div
    class="w-full h-full flex flex-col items-center justify-center p-2 rounded-md text-gray-300 hover:text-indigo-500 hover:bg-indigo-50 transition">
    <i class="fa-solid fa-plus text-lg mb-1"></i>
    <span class="text-[10px]">預約全天</span>
  </div>
</template>


<!-- ==================== Part 2: 預約彈窗與明细樣板 (js-lab-modal 使用) ==================== -->

<!-- 8. 單日預約明細彈窗 - 無預約紀錄時的文字樣板 -->
<template id="lab-day-no-bookings-template">
  <div class="p-8 text-center text-gray-400 font-medium">目前該日無預約紀錄</div>
</template>

<!-- 9. 單日預約明细卡片樣板 -->
<template id="lab-day-booking-card-template">
  <div class="flex-1">
    <h4 class="text-sm font-bold mb-1">{{title}}</h4>
    <div class="flex flex-wrap items-center gap-4 text-xs font-medium mb-1.5 opacity-80">
      <span class="flex items-center gap-1"><i class="fa-regular fa-clock"></i> {{start}} - {{end}}</span>
      <span class="flex items-center gap-1"><i class="fa-regular fa-user"></i> {{user}}</span>
      <span class="flex items-center gap-1"><i class="fa-solid fa-tag"></i> {{courseType}}</span>
      <span class="flex items-center gap-1"><i class="fa-solid fa-users"></i> {{className}}</span>
      {{periodsBadge}}
    </div>
    <div class="pt-1.5 border-t border-black/10 flex flex-col gap-1 text-xs opacity-90">
      <div><span class="font-semibold opacity-75">🧪 化學藥品：</span>{{chemicals}}</div>
      <div><span class="font-semibold opacity-75">🔬 實驗器材：</span>{{equipment}}</div>
    </div>
  </div>
</template>

<!-- 10. 單日預約明細卡片 - 節次商標樣板 -->
<template id="lab-day-periods-badge-template"><span
    class="bg-gray-100 px-1.5 py-0.5 rounded text-gray-600">{{periodsList}}</span></template>

<!-- 11. 教室週行事曆 - 表頭欄位樣板 -->
<template id="lab-room-schedule-header-cell-template">
  <div class="text-sm font-bold {{textClass}}">{{dayName}}</div>
  <div class="text-[10px] text-gray-400 mt-0.5">{{month}}/{{date}}</div>
</template>

<!-- 12. 教室週行事曆 - 空格 hover 提示新增樣板 -->
<template id="lab-room-schedule-hover-template">
  <div class="opacity-0 group-hover/cell:opacity-100 transition duration-150 bg-indigo-600 text-white text-[11px] font-semibold px-2.5 py-1 rounded-md shadow-md pointer-events-none flex items-center gap-1.5 scale-95 group-hover/cell:scale-100 z-10">
    預約 {{startTime}}
  </div>
</template>

<!-- 13. 教室週行事曆 - <=35px 簡短版時段方塊樣板 -->
<template id="lab-room-schedule-block-short-template">
  <div class="text-[10px] font-bold leading-tight truncate">{{start}} {{title}}</div>
</template>

<!-- 14. 教室週行事曆 - 常規多行完整版時段方塊樣板 -->
<template id="lab-room-schedule-block-normal-template">
  <div class="text-[10px] font-semibold opacity-90 leading-none mb-0.5">{{start}} - {{end}}</div>
  <div class="text-xs font-bold leading-tight truncate">{{title}}</div>
  {{userBadge}}
</template>

<!-- 15. 教室週行事曆 - 時段方塊使用者與課程明細樣板 -->
<template id="lab-room-schedule-user-badge-template">
  <div class="text-[10px] opacity-85 mt-auto pt-1 flex flex-col gap-0.5 overflow-hidden leading-tight">
    <div class="truncate flex items-center gap-1"><i class="fa-solid fa-user text-[8px] w-2.5 text-center shrink-0"></i> <span>{{user}}</span></div>
    <div class="truncate flex items-center gap-1"><i class="fa-solid fa-tag text-[8px] w-2.5 text-center shrink-0"></i> <span>{{courseType}}</span></div>
    <div class="truncate flex items-center gap-1"><i class="fa-solid fa-users text-[8px] w-2.5 text-center shrink-0"></i> <span>{{className}}</span></div>
  </div>
</template>
